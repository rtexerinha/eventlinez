services:
  db:
    image: postgres:17
    container_name: eventlinez_db
    restart: always
    environment:
      POSTGRES_DB: eventlinez
      POSTGRES_USER: eventlinez
      POSTGRES_PASSWORD: Texera123@
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: event_app
    restart: always
    depends_on:
      - db
    env_file:
      - .env.docker
    environment:
      # Database Configuration
      - POSTGRES_DB=eventlinez
      - POSTGRES_USER=eventlinez
      - POSTGRES_PASSWORD=Texera123@
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgres://eventlinez:Texera123@@db:5432/eventlinez

      # Django Configuration
      - DEBUG=False
      - SECRET_KEY=docker-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,test.eventlinez.com,45.79.112.247
      - IN_DOCKER=true
      - PROD=True

      # Application Settings
      - EVENTLINEZ_FEE=0.12
      - STATIC_URL=/static/
      - STATIC_ROOT=/app/staticfiles/
      - MEDIA_URL=/media/
      - MEDIA_ROOT=/app/media/
      - ENVIRONMENT=test
      - SEED_DATA=true

      # Email Configuration
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=smtp.sendgrid.net
      - EMAIL_PORT=587
      - EMAIL_USE_TLS=True
      - EMAIL_HOST_USER=apikey
      - EMAIL_HOST_PASSWORD=${SENDGRID_API_KEY}
      - DEFAULT_FROM_EMAIL=noreply@eventlinez.com

      # Stripe Configuration - Using test keys from .env.docker
      - STRIPE_PUBLISHABLE_KEY=pk_test_X0l8E5nTKtSMa8fcs4983IoP00wOhfcpbC
      - STRIPE_SECRET_KEY=sk_test_YHj724JNB8fMwCfcCb4ieHRU007hQB7qwU

      # reCAPTCHA Configuration
      - RECAPTCHA_PUBLIC_KEY=6LdK0-ErAAAAALmLHyOhfrARGwmoAyi0N-43_XSx
      - RECAPTCHA_PRIVATE_KEY=6LdK0-ErAAAAAJDF60tuza2uqVJhMunY4_kPqiz9
      - RECAPTCHA_PROJECT_ID=${RECAPTCHA_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account-key.json
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    platform: linux/amd64

  pgadmin:
    image: dpage/pgadmin4
    container_name: eventlinez_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eventlinez.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pg_data:
