{% extends 'base-new.html' %}
{% load static %}
{% load crispy_forms_filters %}
{% load crispy_forms_tags %}
{% block content %}
    <section class="container p-0 p-lg-5" style="min-height: 75vh;">
        <main class="col-12" style="min-height: 50vh; margin: 3rem auto;">
            <div class="row">

                <aside class="col-lg-6 pt-lg-5">
                    <img style="width: 80%; display: block; margin: auto"
                         src="{% static 'img/password_reset.svg' %}"
                         alt="Password reset">
                </aside>

                <article class="col-lg-6 mt-lg-5 mt-4 pt-lg-5">
                    <div class="col-12">
                        <h3 class="col-12 h3-home mt-3 mb-4 p-0">Reset your password</h3>
                        <form method="post">
                            {% csrf_token %}
                            {{ form| crispy }}
                            <div class="float-right">
                                <button type="submit" class="buttons-primary buttons-reset h6-home mt-4">
                                Submit
                                </button>
                            </div>
                        </form>
                    </div>
                </article>
            </div>
        </main>
    </section>
{% endblock %}
