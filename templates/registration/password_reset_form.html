{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
   <div class="container">
       <div class=" col-md-6 offset-md-3 my-5 limit" >
           <h4>Reset your password</h4>
           <br>
          <form method="post" class="form-limit my-1" >
            {% csrf_token %}
            {{ form| crispy }}
            <button type="submit" class="text-default button-login">Submit</button>
          </form>
       </div>
   </div>
{% endblock %}
