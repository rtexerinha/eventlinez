{% load static %}

<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
            <meta name="description" content="{% block metadescription %}{% endblock %}">
            <link rel="shortcut icon" type="image/jpg" href="{% static 'img/logosmall.jpg' %}"/>
            <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
            <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
                  rel="stylesheet">
            <link rel="stylesheet" href="{% static 'css/resert.css' %}">
            <link rel="stylesheet" href="{% static 'css/promoter.css' %}">
            <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
            <link rel="stylesheet" type="text/css" href="{% static 'css/fontawesome-all.min.css' %}">
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/jquery-datetimepicker/2.5.20/jquery.datetimepicker.min.css"
              integrity="sha256-DOS9W6NR+NFe1fUhEE0PGKY/fubbUCnOfTje2JMDw3Y="
              crossorigin="anonymous" />
            <title>{% block title %}{% endblock %}</title>
        </head>

        <body class="sb-nav-fixed">

            {% include 'navigation.html' %}

            <div id="layoutSidenav">
                {% include 'sidebar.html' %}

                <div id="layoutSidenav_content">

                    {% block content %}{% endblock content %}

                </div>
            </div>
             <script src="https://code.jquery.com/jquery-3.5.1.min.js"
                     crossorigin="anonymous"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"
                    crossorigin="anonymous"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.js"
                    crossorigin="anonymous"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-datetimepicker/2.5.20/jquery.datetimepicker.js"
                    crossorigin="anonymous"></script>
            <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.bundle.min.js"
                    crossorigin="anonymous"></script>
            <script src="/static/js/script.js"></script>
             <script>
                $(function () {
                    $("#datetimepicker").datetimepicker({format: "dd MM yyyy - hh:ii"});
                });
             </script>

        </body>
    </html>
