{% extends "base.html" %}
{% load static %}
{% block title %}
	Ticket - Eventlinez!
{% endblock %}
{% block content %}
	<main style="min-height: 70vh;">
        <section class="col-lg-12 float-right" style="height: 254px;" id="background"></section>
        <div class="clearfix"></div>
        <section class="col-lg-11 col-sm-12 m-auto">
            <h2 class="text-default text-secondary-default pl-4">
                Tickets
            </h2>
        </section>

        <section class="col-lg-11" style="margin: 0 auto; padding-left: 45px">
            <h6 class="text-default" style="font-size: 20px; line-height: 27px; color: #000000;">
                Events
            </h6>

             <div class="col-lg-12 col-sm-12" style="border-top: 1px solid #D7D7D7; margin-bottom: 30px"></div>


              <div class="col-lg-11 mb-5">
                <div class="row">
                        <div class="col-lg-3">event</div>
                             <br>
                             <br>

                        <main class="col-lg-9">
                            <div class="row">
                                <div class="col-lg-3 col-6" style="background: #F4F4F4;">
                                    <h6 class="text-default" style="justify-content: center">Tickets</h6>
                                </div>

                                <div class="col-lg-9 col-6" style="background: #F4F4F4;">
                                    <h6 class="text-default">Guest Name</h6>
                                </div>

                            </div>


                            <article class="row">
                            {% for tickets in tickets %}

                                <div class="col-lg-3 col-6" style="padding: 0.5rem 0;">
                                    <p class="text-default" style="height: 32px;
                                                                   border-bottom: 1px solid #D7D7D7;
                                                                   justify-content: center;
                                                                   text-align:center;
                                                                   margin-bottom: 0;">
                                        {{ tickets.id }}
                                    </p>
                                </div>

                                <form class="col-lg-9 col-6" style="border-bottom: 1px solid #D7D7D7;
                                                              {#background: #00cc66;#}
                                                              padding: 0.5rem 0; height: 40px; ">
                                    <input class="col-12"
                                           type="text"
                                           value="{{ tickets.guest_name }}"
                                           name="guest"
                                           id="guest"
                                           style="border: 1px solid transparent;
                                                  border-left: 1px solid #D7D7D7;">

                                </form>
                            {% endfor %}
                            </article>
                        </main>

                </div>
              </div>
        </section>
	</main>

{% endblock %}
