<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>New Order #{{ order.id }} - EventLinez </title>
        <style type="text/css">
           #title-message{color: #d90075;}
            .tg  {border-collapse:collapse;border-spacing:0;}
            .tg td{border-color:black;border-style:solid;border-width:1px;font-family:Arial, sans-serif;font-size:14px;
              overflow:hidden;padding:10px 5px;word-break:normal;}
            .tg th{border-color:black;border-style:solid;border-width:1px;font-family:Arial, sans-serif;font-size:14px;
              font-weight:normal;overflow:hidden;padding:10px 5px;word-break:normal;}
            .tg .tg-ugcu{background-color:#d90075;border-color:inherit;color:#ffffff;font-size:14px;text-align:center;vertical-align:top}
            .tg .tg-ob96{background-color:#d90075;border-color:inherit;color:#ffffff;text-align:center;vertical-align:top}
            .tg .tg-l93j{border-color:inherit;font-size:16px;font-weight:bold;text-align:center;vertical-align:top}
            .tg .tg-c3ow{border-color:inherit;text-align:center;vertical-align:top}
            .tg .tg-uaft{border-color:inherit;color:#e10087;font-size:32px;text-align:center;vertical-align:top}
            .tg .tg-yhtz{background-color:#D90075;border-color:inherit;color:#FFF;font-weight:bold;text-align:center;vertical-align:top}
            .tg .tg-73oq{border-color:#000000;text-align:left;vertical-align:top}
            .tg .tg-uah7{border-color:#000000;color:#212529;text-align:center;vertical-align:top}
			#mensage {padding-right: 50px;padding-left: 50px;
			}
            a{ color: #d90075; text-decoration: none;}
		</style>
	</head>
	<body>
         <div style="width: 80%;margin: auto">
             <div style="text-align: center">
			    <h1 id="title-message">Payout</h1>
			    <p>This email is to notify you of the payout made from our platform to your bank account.
                    <br>Please make sure the payout has been received.
                </p>
             </div>
		    <br>

            <table class="tg" style="margin: auto">
                <thead>
                  <tr>
                    <th class="tg-uaft" colspan="4">
                        <span style="font-weight:700;font-style:normal">Eventlinez</span></th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td class="tg-l93j" colspan="2">--</td>
                    <td class="tg-c3ow" colspan="2">--</td>
                  </tr>
                  <tr>
                    <td class="tg-ob96" colspan="4">
                        <span style="font-weight:bolder;font-style:normal">
                            Payment details:
                        </span>
                        <br><br>
                        <span style="font-weight:400;font-style:normal">
                            Paid successfully via Stripe.
                        </span>
                    </td>
                  </tr>
                </tbody>
            </table>

			<br>
			<p id="mensage" style="text-align: center">
                Any question, please contact us at eventlinez.adm@gmail.com
            </p>
	        </div>

	</body>
</html>
