name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_eventlinez
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage

    - name: Set up environment variables
      run: |
        echo "DEBUG=True" >> .env
        echo "SECRET_KEY=test-secret-key-for-ci" >> .env
        echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/test_eventlinez" >> .env
        echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env

    - name: Run migrations
      run: |
        python manage.py migrate

    - name: Run tests
      run: |
        coverage run --source='.' manage.py test
        coverage report
        coverage xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

    - name: Add server to known hosts
      run: |
        ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to Production
      run: |
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
        set -e
        
        # Colors for output
        RED='\033[0;31m'
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        BLUE='\033[0;34m'
        NC='\033[0m'
        
        echo -e "${BLUE}╔════════════════════════════════════════╗${NC}"
        echo -e "${BLUE}║    Automated Production Deployment    ║${NC}"
        echo -e "${BLUE}╚════════════════════════════════════════╝${NC}"
        
        # Configuration
        PROJECT_DIR="/var/www/eventlinez"
        BACKUP_DIR="/home/sunset/backups"
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        
        # Step 1: Create Backup
        echo -e "\n${BLUE}▶ Creating backup...${NC}"
        mkdir -p $BACKUP_DIR/$TIMESTAMP
        
        # Backup database
        echo "  → Backing up database..."
        sudo -u postgres pg_dump eventlinez_db > $BACKUP_DIR/$TIMESTAMP/eventlinez_db_backup.sql 2>&1 || echo "Database backup failed"
        echo -e "  ${GREEN}✓ Database backup complete${NC}"
        
        # Backup media files
        echo "  → Backing up media files..."
        cp -r $PROJECT_DIR/media $BACKUP_DIR/$TIMESTAMP/ 2>/dev/null || true
        echo -e "  ${GREEN}✓ Media files backup complete${NC}"
        
        # Backup environment file
        echo "  → Backing up environment file..."
        cp $PROJECT_DIR/.env $BACKUP_DIR/$TIMESTAMP/.env.backup 2>/dev/null || true
        echo -e "  ${GREEN}✓ Environment file backup complete${NC}"
        
        # Create backup info
        cat > $BACKUP_DIR/$TIMESTAMP/backup_info.txt << EOI
        Backup Date: $(date)
        Backup Location: $BACKUP_DIR/$TIMESTAMP
        Deployment Type: Automated CI/CD
        Commit: $GITHUB_SHA
        Branch: main
        EOI
        
        # Step 2: Stop services (gracefully)
        echo -e "\n${BLUE}▶ Stopping services...${NC}"
        if systemctl is-active --quiet gunicorn; then
            sudo systemctl stop gunicorn
            echo -e "  ${GREEN}✓ Gunicorn stopped${NC}"
        fi
        
        # Step 3: Pull latest code
        echo -e "\n${BLUE}▶ Pulling latest code...${NC}"
        cd $PROJECT_DIR
        git fetch origin
        git checkout main
        git pull origin main
        echo -e "${GREEN}✓ Code updated${NC}"
        
        # Step 4: Activate virtual environment and update dependencies
        echo -e "\n${BLUE}▶ Updating dependencies...${NC}"
        source venv/bin/activate
        pip install --upgrade pip -q
        pip install -r requirements.txt -q
        echo -e "${GREEN}✓ Dependencies updated${NC}"
        
        # Step 5: Run database migrations
        echo -e "\n${BLUE}▶ Running database migrations...${NC}"
        python manage.py migrate --noinput
        echo -e "${GREEN}✓ Migrations applied${NC}"
        
        # Step 6: Collect static files
        echo -e "\n${BLUE}▶ Collecting static files...${NC}"
        python manage.py collectstatic --noinput --clear
        
        # Verify no HTML templates in static files
        TEMPLATE_COUNT=$(find $PROJECT_DIR/staticfiles -name "*.html" -type f 2>/dev/null | wc -l)
        if [ "$TEMPLATE_COUNT" -gt 0 ]; then
            echo -e "  ${YELLOW}⚠ Found $TEMPLATE_COUNT HTML templates in staticfiles - removing them...${NC}"
            find $PROJECT_DIR/staticfiles -name "*.html" -type f -delete
        fi
        echo -e "${GREEN}✓ Static files collected${NC}"
        
        # Step 7: Clear caches
        echo -e "\n${BLUE}▶ Clearing caches...${NC}"
        python manage.py shell -c "from django.core.cache import cache; cache.clear()" || true
        find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
        find . -name "*.pyc" -delete 2>/dev/null || true
        echo -e "${GREEN}✓ Caches cleared${NC}"
        
        # Step 8: Run deployment checks
        echo -e "\n${BLUE}▶ Running deployment checks...${NC}"
        python manage.py check --deploy --fail-level WARNING
        echo -e "${GREEN}✓ Deployment checks passed${NC}"
        
        # Step 9: Set proper permissions
        echo -e "\n${BLUE}▶ Setting permissions...${NC}"
        chown -R sunset:sunset $PROJECT_DIR
        chmod -R 755 $PROJECT_DIR
        chmod 644 $PROJECT_DIR/.env
        echo -e "${GREEN}✓ Permissions set${NC}"
        
        # Step 10: Start services
        echo -e "\n${BLUE}▶ Starting services...${NC}"
        sudo systemctl start gunicorn
        sudo systemctl start nginx
        
        # Wait for services to start
        sleep 5
        
        if systemctl is-active --quiet gunicorn; then
            echo -e "  ${GREEN}✓ Gunicorn started${NC}"
        else
            echo -e "  ${RED}✗ Gunicorn failed to start${NC}"
            sudo journalctl -u gunicorn --no-pager -n 10
        fi
        
        if systemctl is-active --quiet nginx; then
            echo -e "  ${GREEN}✓ Nginx started${NC}"
        else
            echo -e "  ${RED}✗ Nginx failed to start${NC}"
        fi
        
        # Step 11: Health check
        echo -e "\n${BLUE}▶ Running health check...${NC}"
        sleep 10
        
        if curl -f -s http://localhost/ > /dev/null; then
            echo -e "${GREEN}✓ Health check passed${NC}"
        else
            echo -e "${RED}✗ Health check failed${NC}"
            echo "Recent logs:"
            sudo journalctl -u gunicorn --no-pager -n 20
        fi
        
        # Step 12: Cleanup old backups (keep last 10)
        echo -e "\n${BLUE}▶ Cleaning up old backups...${NC}"
        cd $BACKUP_DIR
        ls -t | tail -n +11 | xargs -r rm -rf
        echo -e "${GREEN}✓ Old backups cleaned${NC}"
        
        echo -e "\n${GREEN}╔════════════════════════════════════════╗${NC}"
        echo -e "${GREEN}║     Deployment Completed Successfully  ║${NC}"
        echo -e "${GREEN}╚════════════════════════════════════════╝${NC}"
        echo ""
        echo "Backup location: $BACKUP_DIR/$TIMESTAMP"
        echo "Deployment time: $(date)"
        echo ""
        
        ENDSSH

    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Production deployment successful!"
        else
          echo "❌ Production deployment failed!"
        fi

    - name: Post-deployment verification
      run: |
        # Wait a bit for the service to fully start
        sleep 30
        
        # Check if the site is responding
        if curl -f -s --max-time 30 https://eventlinez.com/ > /dev/null; then
          echo "✅ Site is responding correctly"
        else
          echo "⚠️ Site may not be responding properly - please check manually"
        fi