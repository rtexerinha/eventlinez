name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      backup_timestamp:
        description: 'Backup timestamp to restore (YYYYMMDD_HHMMSS) - leave empty for latest'
        required: false
        type: string
      confirm_rollback:
        description: 'Type "CONFIRM" to proceed with rollback'
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_rollback == 'CONFIRM'

    steps:
    - uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

    - name: Add server to known hosts
      run: |
        ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

    - name: Execute Rollback
      run: |
        ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
        set -e
        
        # Colors for output
        RED='\033[0;31m'
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        BLUE='\033[0;34m'
        NC='\033[0m'
        
        echo -e "${RED}╔════════════════════════════════════════╗${NC}"
        echo -e "${RED}║        PRODUCTION ROLLBACK             ║${NC}"
        echo -e "${RED}╚════════════════════════════════════════╝${NC}"
        
        # Configuration
        PROJECT_DIR="/var/www/eventlinez"
        BACKUP_DIR="/home/sunset/backups"
        BACKUP_TIMESTAMP="${{ github.event.inputs.backup_timestamp }}"
        
        # Step 1: Find backup to restore
        echo -e "\n${BLUE}▶ Finding backup to restore...${NC}"
        
        if [ -z "$BACKUP_TIMESTAMP" ]; then
            # Find the latest backup
            LATEST_BACKUP=$(ls -t $BACKUP_DIR | head -n 1)
            if [ -z "$LATEST_BACKUP" ]; then
                echo -e "${RED}✗ No backups found!${NC}"
                exit 1
            fi
            RESTORE_DIR="$BACKUP_DIR/$LATEST_BACKUP"
            echo -e "Using latest backup: ${GREEN}$LATEST_BACKUP${NC}"
        else
            RESTORE_DIR="$BACKUP_DIR/$BACKUP_TIMESTAMP"
            if [ ! -d "$RESTORE_DIR" ]; then
                echo -e "${RED}✗ Backup not found: $BACKUP_TIMESTAMP${NC}"
                echo "Available backups:"
                ls -la $BACKUP_DIR
                exit 1
            fi
            echo -e "Using specified backup: ${GREEN}$BACKUP_TIMESTAMP${NC}"
        fi
        
        echo -e "Restore directory: $RESTORE_DIR"
        
        # Step 2: Create pre-rollback backup
        echo -e "\n${BLUE}▶ Creating pre-rollback backup...${NC}"
        PRE_ROLLBACK_TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        PRE_ROLLBACK_DIR="$BACKUP_DIR/pre_rollback_$PRE_ROLLBACK_TIMESTAMP"
        mkdir -p $PRE_ROLLBACK_DIR
        
        # Backup current database
        sudo -u postgres pg_dump eventlinez_db > $PRE_ROLLBACK_DIR/eventlinez_db_backup.sql 2>&1
        
        # Backup current media files
        cp -r $PROJECT_DIR/media $PRE_ROLLBACK_DIR/ 2>/dev/null || true
        
        # Backup current environment file
        cp $PROJECT_DIR/.env $PRE_ROLLBACK_DIR/.env.backup 2>/dev/null || true
        
        echo -e "${GREEN}✓ Pre-rollback backup created: $PRE_ROLLBACK_DIR${NC}"
        
        # Step 3: Stop services
        echo -e "\n${BLUE}▶ Stopping services...${NC}"
        sudo systemctl stop gunicorn
        sudo systemctl stop nginx
        echo -e "${GREEN}✓ Services stopped${NC}"
        
        # Step 4: Restore database
        echo -e "\n${BLUE}▶ Restoring database...${NC}"
        if [ -f "$RESTORE_DIR/eventlinez_db_backup.sql" ]; then
            sudo -u postgres dropdb eventlinez_db || true
            sudo -u postgres createdb eventlinez_db
            sudo -u postgres psql eventlinez_db < $RESTORE_DIR/eventlinez_db_backup.sql
            echo -e "${GREEN}✓ Database restored${NC}"
        else
            echo -e "${YELLOW}⚠ No database backup found in restore directory${NC}"
        fi
        
        # Step 5: Restore media files
        echo -e "\n${BLUE}▶ Restoring media files...${NC}"
        if [ -d "$RESTORE_DIR/media" ]; then
            rm -rf $PROJECT_DIR/media
            cp -r $RESTORE_DIR/media $PROJECT_DIR/
            chown -R sunset:sunset $PROJECT_DIR/media
            echo -e "${GREEN}✓ Media files restored${NC}"
        else
            echo -e "${YELLOW}⚠ No media backup found in restore directory${NC}"
        fi
        
        # Step 6: Restore environment file
        echo -e "\n${BLUE}▶ Restoring environment file...${NC}"
        if [ -f "$RESTORE_DIR/.env.backup" ]; then
            cp $RESTORE_DIR/.env.backup $PROJECT_DIR/.env
            chmod 644 $PROJECT_DIR/.env
            echo -e "${GREEN}✓ Environment file restored${NC}"
        else
            echo -e "${YELLOW}⚠ No environment backup found${NC}"
        fi
        
        # Step 7: Reset code to previous state (if backup info exists)
        echo -e "\n${BLUE}▶ Checking for code version info...${NC}"
        if [ -f "$RESTORE_DIR/backup_info.txt" ]; then
            if grep -q "Commit:" $RESTORE_DIR/backup_info.txt; then
                COMMIT_HASH=$(grep "Commit:" $RESTORE_DIR/backup_info.txt | cut -d' ' -f2)
                cd $PROJECT_DIR
                git fetch origin
                git checkout $COMMIT_HASH
                echo -e "${GREEN}✓ Code reverted to commit: $COMMIT_HASH${NC}"
            fi
        else
            echo -e "${YELLOW}⚠ No backup info found, keeping current code${NC}"
        fi
        
        # Step 8: Reinstall dependencies and collect static files
        echo -e "\n${BLUE}▶ Reinstalling dependencies...${NC}"
        cd $PROJECT_DIR
        source venv/bin/activate
        pip install -r requirements.txt -q
        echo -e "${GREEN}✓ Dependencies installed${NC}"
        
        echo -e "\n${BLUE}▶ Collecting static files...${NC}"
        python manage.py collectstatic --noinput --clear
        echo -e "${GREEN}✓ Static files collected${NC}"
        
        # Step 9: Set permissions
        echo -e "\n${BLUE}▶ Setting permissions...${NC}"
        chown -R sunset:sunset $PROJECT_DIR
        chmod -R 755 $PROJECT_DIR
        chmod 644 $PROJECT_DIR/.env
        echo -e "${GREEN}✓ Permissions set${NC}"
        
        # Step 10: Start services
        echo -e "\n${BLUE}▶ Starting services...${NC}"
        sudo systemctl start gunicorn
        sudo systemctl start nginx
        
        sleep 10
        
        if systemctl is-active --quiet gunicorn; then
            echo -e "  ${GREEN}✓ Gunicorn started${NC}"
        else
            echo -e "  ${RED}✗ Gunicorn failed to start${NC}"
        fi
        
        if systemctl is-active --quiet nginx; then
            echo -e "  ${GREEN}✓ Nginx started${NC}"
        else
            echo -e "  ${RED}✗ Nginx failed to start${NC}"
        fi
        
        # Step 11: Health check
        echo -e "\n${BLUE}▶ Running health check...${NC}"
        sleep 10
        
        if curl -f -s http://localhost/ > /dev/null; then
            echo -e "${GREEN}✓ Health check passed${NC}"
        else
            echo -e "${RED}✗ Health check failed${NC}"
            sudo journalctl -u gunicorn --no-pager -n 20
        fi
        
        echo -e "\n${GREEN}╔════════════════════════════════════════╗${NC}"
        echo -e "${GREEN}║       ROLLBACK COMPLETED               ║${NC}"
        echo -e "${GREEN}╚════════════════════════════════════════╝${NC}"
        echo ""
        echo "Restored from: $RESTORE_DIR"
        echo "Pre-rollback backup: $PRE_ROLLBACK_DIR"
        echo "Rollback time: $(date)"
        echo ""
        echo "Please verify the application is working correctly!"
        
        ENDSSH

    - name: Notify rollback status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Production rollback completed!"
        else
          echo "❌ Production rollback failed!"
        fi