name: Test and Deploy

on:
  push:
    branches: [ develop, main, master ]
  pull_request:
    branches: [ develop, main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create .env.docker file for testing
      run: |
        cat > .env.docker << 'EOF'
        DEBUG=True
        SECRET_KEY=test-secret-key-for-ci-cd-pipeline
        ALLOWED_HOSTS=localhost,127.0.0.1
        DATABASE_URL=postgres://eventlinez:Texera123@@db:5432/eventlinez
        STRIPE_PUBLISHABLE_KEY=pk_test_X0l8E5nTKtSMa8fcs4983IoP00wOhfcpbC
        STRIPE_SECRET_KEY=sk_test_YHj724JNB8fMwCfcCb4ieHRU007hQB7qwU
        RECAPTCHA_PUBLIC_KEY=6LdK0-ErAAAAALmLHyOhfrARGwmoAyi0N-43_XSx
        RECAPTCHA_PRIVATE_KEY=6LdK0-ErAAAAAJDF60tuza2uqVJhMunY4_kPqiz9
        EVENTLINEZ_FEE=0.12
        ENVIRONMENT=test
        SEED_DATA=true
        EOF

    - name: Build and test
      run: |
        docker compose build --no-cache
        docker compose up -d
        sleep 15
        
        # Wait for database
        RETRIES=30
        while ! docker compose exec -T db pg_isready -U eventlinez -d eventlinez > /dev/null 2>&1; do
          RETRIES=$((RETRIES - 1))
          if [ $RETRIES -eq 0 ]; then
            echo "Database failed to start"
            docker compose logs db
            exit 1
          fi
          echo "Waiting for database... ($RETRIES attempts left)"
          sleep 2
        done
        
        # Run migrations and tests
        docker compose exec -T web python manage.py migrate --noinput
        docker compose exec -T -e DEBUG=True web python manage.py test --verbosity=2
        docker compose exec -T web python manage.py collectstatic --noinput --clear
        
        # Health check
        sleep 10
        if curl -f -s http://localhost:8000/admin/ > /dev/null; then
          echo "✅ Application health check passed"
        else
          echo "❌ Application health check failed"
          docker compose logs web
          exit 1
        fi

    - name: Cleanup
      if: always()
      run: docker compose down -v

  deploy-test:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v3

    - name: Get commit info
      id: commit
      run: |
        echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        echo "commit_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "commit_message=$(git log -1 --pretty=%B | head -n1)" >> $GITHUB_OUTPUT

    - name: Install sshpass
      run: |
        sudo apt-get update && sudo apt-get install -y sshpass
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.TEST_SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: Create deployment archive
      run: |
        echo "📦 Creating deployment archive..."
        # Fix any future timestamps before creating archive
        find . -type f -newer /proc/1/stat 2>/dev/null | head -10 | while read file; do
          echo "Fixing future timestamp on: $file"
          touch "$file"
        done
        
        # Create archive with more specific exclusions and ignore warnings about files changing
        tar -czf eventlinez-deploy.tar.gz \
          --exclude='.git' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          --exclude='*.pyo' \
          --exclude='node_modules' \
          --exclude='.env*' \
          --exclude='venv' \
          --exclude='env' \
          --exclude='staticfiles' \
          --exclude='media/CACHE' \
          --exclude='*.log' \
          --exclude='.pytest_cache' \
          --exclude='.coverage' \
          --exclude='htmlcov' \
          --exclude='tmp' \
          --exclude='*.tmp' \
          --exclude='*.swp' \
          --exclude='.DS_Store' \
          --exclude='db.sqlite3' \
          --exclude='cookies.txt' \
          --exclude='backups' \
          --warning=no-file-changed \
          --warning=no-timestamp \
          . || [ $? -eq 1 ]
        
        # Verify archive was created successfully
        if [ -f "eventlinez-deploy.tar.gz" ]; then
          echo "✅ Archive created successfully"
          ls -lh eventlinez-deploy.tar.gz
        else
          echo "❌ Failed to create archive"
          exit 1
        fi

    - name: Create simple deployment script
      run: |
        cat > simple_deploy.sh << 'EOF'
        #!/bin/bash
        set -e
        
        echo "🚀 Starting deployment to test server..."
        echo "📋 Deployment Info:"
        echo "   - Commit: ${{ steps.commit.outputs.commit_short }}"
        echo "   - Message: ${{ steps.commit.outputs.commit_message }}"
        echo "   - Time: $(date '+%Y-%m-%d %H:%M:%S')"
        
        # Stop any running services first
        echo "⏹️ Stopping services..."
        pkill -f "gunicorn.*eventlinez" || echo "Service not running"
        
        # Extract the deployment archive directly to /home/sunset/eventlinez
        echo "📥 Extracting deployment files..."
        if [ -f /tmp/eventlinez-deploy.tar.gz ]; then
          # Create backup if directory exists
          if [ -d "/home/sunset/eventlinez" ]; then
            echo "💾 Creating backup..."
            mv /home/sunset/eventlinez "/home/sunset/eventlinez_backup_$(date +%Y%m%d_%H%M%S)" || echo "Warning: Could not create backup"
          fi
          
          # Create the target directory
          mkdir -p /home/sunset/eventlinez
          cd /home/sunset/eventlinez
          tar -xzf /tmp/eventlinez-deploy.tar.gz
          echo "✅ Code extracted successfully to /home/sunset/eventlinez"
        else
          echo "❌ Deployment archive not found"
          exit 1
        fi
        
        # Setup virtual environment
        echo "🐍 Setting up Python environment..."
        if [ ! -d "venv" ]; then
          python3 -m venv venv
        fi
        source venv/bin/activate
        
        # Install dependencies with fallback for celery compatibility
        echo "📦 Installing dependencies..."
        
        # First, try with current pip
        if pip install -r requirements.txt -q; then
          echo "✅ Dependencies installed successfully"
        else
          echo "⚠️ Modern pip failed, trying with older pip for celery compatibility..."
          # Downgrade pip temporarily to handle celery metadata issues
          pip install 'pip<24.1' -q
          pip install -r requirements.txt -q
          echo "✅ Dependencies installed with compatibility mode"
        fi
        
        # Create environment file
        echo "⚙️ Setting up environment..."
        cat > .env << 'ENV_EOF'
        DEBUG=False
        SECRET_KEY=test-server-secret-key-change-in-production
        ALLOWED_HOSTS=localhost,127.0.0.1,test.eventlinez.com,${{ secrets.TEST_SERVER_HOST }}
        POSTGRES_DB=eventlinez
        POSTGRES_USER=eventlinez
        POSTGRES_PASSWORD=Texera123@
        POSTGRES_HOST=localhost
        POSTGRES_PORT=5432
        STATIC_ROOT=/home/sunset/eventlinez/staticfiles
        MEDIA_ROOT=/home/sunset/eventlinez/media
        APP_HOST=https://test.eventlinez.com
        STRIPE_SECRET_KEY=sk_test_YHj724JNB8fMwCfcCb4ieHRU007hQB7qwU
        STRIPE_PUBLISHABLE_KEY=pk_test_X0l8E5nTKtSMa8fcs4983IoP00wOhfcpbC
        RECAPTCHA_PUBLIC_KEY=6LdK0-ErAAAAALmLHyOhfrARGwmoAyi0N-43_XSx
        RECAPTCHA_PRIVATE_KEY=6LdK0-ErAAAAAJDF60tuza2uqVJhMunY4_kPqiz9
        EVENTLINEZ_FEE=0.12
        ENVIRONMENT=test
        ENV_EOF
        
        # Run Django commands
        echo "🗄️ Running Django commands..."
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput --clear
        echo "✅ Django setup complete"
        
        # Start application
        echo "🚀 Starting application..."
        cd /home/sunset/eventlinez
        nohup gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 eventlinez.wsgi:application > /tmp/django.log 2>&1 &
        
        # Wait and health check
        echo "🔍 Checking application health..."
        sleep 15
        if curl -f -s http://localhost:8000/ > /dev/null 2>&1; then
          echo "✅ Deployment successful - Application is responding"
          echo "success" > /tmp/deployment_status
        else
          echo "⚠️ Application health check failed"
          if [ -f /tmp/django.log ]; then
            echo "📋 Recent logs:"
            tail -20 /tmp/django.log
          fi
          echo "warning" > /tmp/deployment_status
        fi
        
        echo "✅ Deployment script completed"
        EOF
        
        chmod +x simple_deploy.sh

    - name: Deploy to test server
      run: |
        echo "🚀 Deploying to test server..."
        # Transfer the deployment archive and script
        sshpass -p "${{ secrets.TEST_SERVER_PASSWORD }}" scp -o StrictHostKeyChecking=no eventlinez-deploy.tar.gz ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }}:/tmp/
        sshpass -p "${{ secrets.TEST_SERVER_PASSWORD }}" scp -o StrictHostKeyChecking=no simple_deploy.sh ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }}:/tmp/simple_deploy.sh
        # Execute the deployment script
        sshpass -p "${{ secrets.TEST_SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} "chmod +x /tmp/simple_deploy.sh && /tmp/simple_deploy.sh"

    - name: Verify deployment
      run: |
        echo "🔍 Verifying deployment..."
        
        # Test site accessibility
        if curl -f -s --max-time 10 "http://${{ secrets.TEST_SERVER_HOST }}/" > /dev/null 2>&1; then
          echo "✅ Site is accessible at http://${{ secrets.TEST_SERVER_HOST }}:8000/"
          SITE_ACCESSIBLE=true
        else
          echo "❌ Site is not accessible"
          SITE_ACCESSIBLE=false
        fi
        
        # Get deployment status
        DEPLOYMENT_STATUS=$(sshpass -p "${{ secrets.TEST_SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} "cat /tmp/deployment_status 2>/dev/null || echo 'unknown'")
        
        echo "📊 Deployment Status: $DEPLOYMENT_STATUS"
        echo "🌐 Site Accessible: $SITE_ACCESSIBLE"
        
        # If site is accessible, consider deployment successful even with warnings
        if [ "$SITE_ACCESSIBLE" == "true" ]; then
          if [ "$DEPLOYMENT_STATUS" == "success" ]; then
            echo "✅ Deployment completed successfully!"
          else
            echo "⚠️ Deployment completed with warnings but site is accessible"
          fi
          echo "🌐 Site: http://${{ secrets.TEST_SERVER_HOST }}/"
          echo "📊 Commit: ${{ steps.commit.outputs.commit_short }}"
        else
          echo "❌ Deployment failed - site is not accessible"
          exit 1
        fi