name: Test and Deploy

on:
  push:
    branches: [ develop, main, master ]
  pull_request:
    branches: [ develop, main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create .env.docker file for testing
      run: |
        cat > .env.docker << 'EOF'
        # Django Configuration for Testing
        DEBUG=True
        SECRET_KEY=test-secret-key-for-ci-cd-pipeline
        ALLOWED_HOSTS=localhost,127.0.0.1
        
        # Database Configuration (will be overridden by docker-compose environment)
        DATABASE_URL=postgres://eventlinez:Texera123@@db:5432/eventlinez
        
        # Stripe Test Keys
        STRIPE_PUBLISHABLE_KEY=pk_test_X0l8E5nTKtSMa8fcs4983IoP00wOhfcpbC
        STRIPE_SECRET_KEY=sk_test_YHj724JNB8fMwCfcCb4ieHRU007hQB7qwU
        
        # reCAPTCHA Test Configuration
        RECAPTCHA_PUBLIC_KEY=6LdK0-ErAAAAALmLHyOhfrARGwmoAyi0N-43_XSx
        RECAPTCHA_PRIVATE_KEY=6LdK0-ErAAAAAJDF60tuza2uqVJhMunY4_kPqiz9
        RECAPTCHA_PROJECT_ID=
        
        # SendGrid (empty for testing)
        SENDGRID_API_KEY=
        
        # Application Settings
        EVENTLINEZ_FEE=0.12
        ENVIRONMENT=test
        SEED_DATA=true
        EOF

    - name: Build Docker images
      run: |
        docker compose build --no-cache

    - name: Start test environment
      run: |
        docker compose up -d

    - name: Wait for database to be ready
      run: |
        echo "Waiting for database to be ready..."
        sleep 15
        
        # Check if database is ready
        RETRIES=30
        while ! docker compose exec -T db pg_isready -U eventlinez -d eventlinez > /dev/null 2>&1; do
          RETRIES=$((RETRIES - 1))
          if [ $RETRIES -eq 0 ]; then
            echo "Database failed to start"
            docker compose logs db
            exit 1
          fi
          echo "Waiting for database... ($RETRIES attempts left)"
          sleep 2
        done
        echo "Database is ready"

    - name: Run database migrations
      run: |
        docker compose exec -T web python manage.py migrate --noinput

    - name: Run tests in Docker
      run: |
        docker compose exec -T web python manage.py test --verbosity=2

    - name: Collect static files
      run: |
        docker compose exec -T web python manage.py collectstatic --noinput --clear

    - name: Check application health
      run: |
        # Wait for application to be ready
        sleep 10
        
        # Test if application responds
        if curl -f -s http://localhost:8000/admin/ > /dev/null; then
          echo "✅ Application health check passed"
        else
          echo "❌ Application health check failed"
          echo "Container logs:"
          docker compose logs web
          exit 1
        fi

    - name: Stop test environment
      if: always()
      run: |
        docker compose down -v

    - name: Test Results Summary
      run: |
        echo "🧪 Test Results Summary:"
        echo "✅ Docker build completed"
        echo "✅ Database migrations successful" 
        echo "✅ All tests passed"
        echo "✅ Static files collected"
        echo "✅ Application health check passed"

  deploy-test:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Get commit info
      id: commit
      run: echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Check deployment prerequisites
      run: |
        if [ -z "${{ secrets.TEST_SERVER_HOST }}" ] || [ -z "${{ secrets.TEST_SERVER_USER }}" ] || [ -z "${{ secrets.TEST_SERVER_PASSWORD }}" ]; then
          echo "❌ Server connection secrets not configured"
          exit 1
        else
          echo "✅ Server connection secrets configured. Proceeding with deployment."
        fi

    - name: Install sshpass
      run: sudo apt-get update && sudo apt-get install -y sshpass

    - name: Add server to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.TEST_SERVER_HOST }} >> ~/.ssh/known_hosts
        echo "✅ SSH connection setup completed"

    - name: Deploy with Docker to test server
      run: |
        echo "🚀 Starting Docker-based deployment to test server..."
        echo "📋 Deployment Info:"
        echo "   - Commit: $(git rev-parse --short HEAD)"
        echo "   - Branch: ${GITHUB_REF#refs/heads/}"
        echo "   - Message: $(git log -1 --pretty=%B | head -n1)"
        echo "   - Time: $(date '+%Y-%m-%d %H:%M:%S')"
        
        # Execute deployment on server
        sshpass -p "${{ secrets.TEST_SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} << 'DEPLOY_EOF'
        set -e
        
        echo "🐳 Docker Deployment Starting..."
        PROJECT_DIR="/home/sunset/eventlinez"
        cd $PROJECT_DIR
        
        # Install Docker if not present
        if ! command -v docker &> /dev/null; then
          echo "Installing Docker..."
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo usermod -aG docker $USER
          
          # Install Docker Compose
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.21.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          echo "✅ Docker installed"
        fi
        
        # Stop existing containers
        docker-compose down 2>/dev/null || docker compose down 2>/dev/null || true
        
        # Pull latest code
        git fetch origin
        git checkout develop
        git pull origin develop
        
        # Create environment file
        cat > .env.docker << 'ENV_EOF'
        DEBUG=False
        SECRET_KEY=test-server-secret-key-change-in-production
        ALLOWED_HOSTS=localhost,127.0.0.1,test.eventlinez.com,45.79.112.247
        DATABASE_URL=postgres://eventlinez:Texera123@@db:5432/eventlinez
        STRIPE_PUBLISHABLE_KEY=pk_test_X0l8E5nTKtSMa8fcs4983IoP00wOhfcpbC
        STRIPE_SECRET_KEY=sk_test_YHj724JNB8fMwCfcCb4ieHRU007hQB7qwU
        RECAPTCHA_PUBLIC_KEY=6LdK0-ErAAAAALmLHyOhfrARGwmoAyi0N-43_XSx
        RECAPTCHA_PRIVATE_KEY=6LdK0-ErAAAAAJDF60tuza2uqVJhMunY4_kPqiz9
        RECAPTCHA_PROJECT_ID=
        SENDGRID_API_KEY=
        EVENTLINEZ_FEE=0.12
        ENVIRONMENT=test
        SEED_DATA=true
        ENV_EOF
        
        # Build and start containers
        docker-compose build --no-cache web || docker compose build --no-cache web
        docker-compose up -d || docker compose up -d
        
        # Wait for services
        sleep 30
        
        # Run migrations
        (docker-compose exec -T web python manage.py migrate --noinput) || (docker compose exec -T web python manage.py migrate --noinput)
        
        # Collect static files
        (docker-compose exec -T web python manage.py collectstatic --noinput --clear) || (docker compose exec -T web python manage.py collectstatic --noinput --clear)
        
        echo "✅ Docker deployment completed"
        DEPLOY_EOF

    - name: Verify deployment
      run: |
        echo "🔍 Verifying deployment..."
        
        # Wait for application to be fully ready
        sleep 20
        
        # Test site accessibility
        RETRIES=5
        ACCESSIBLE=false
        for i in $(seq 1 $RETRIES); do
          if curl -f -s --max-time 10 http://45.79.112.247:8000/ > /dev/null 2>&1; then
            echo "✅ Site is accessible"
            ACCESSIBLE=true
            break
          fi
          echo "Attempt $i/$RETRIES failed, waiting..."
          sleep 10
        done
        
        if [ "$ACCESSIBLE" = "false" ]; then
          echo "❌ Site is not accessible after $RETRIES attempts"
          # Check server status
          sshpass -p "${{ secrets.TEST_SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} "
            echo 'Container status:'
            docker-compose ps 2>/dev/null || docker compose ps 2>/dev/null || echo 'No containers running'
            echo 'Application logs:'
            docker-compose logs --tail=20 web 2>/dev/null || docker compose logs --tail=20 web 2>/dev/null || echo 'No logs available'
          "
          exit 1
        fi

    - name: Deployment Results
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment to test.eventlinez.com completed successfully!"
          echo "🌐 Site: http://test.eventlinez.com/"
          echo "🌐 Direct: http://45.79.112.247:8000/"
          echo "📊 Commit: $(git rev-parse --short HEAD)"
          echo "⏰ Time: $(date '+%Y-%m-%d %H:%M:%S')"
        else
          echo "❌ Deployment to test.eventlinez.com failed!"
          echo "Please check the deployment logs above for details."
        fi