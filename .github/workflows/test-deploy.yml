name: Deploy to Test Environment

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create .env.docker file for testing
      run: |
        cat > .env.docker << 'EOF'
        # Django Configuration for Testing
        DEBUG=True
        SECRET_KEY=test-secret-key-for-ci-cd-pipeline
        ALLOWED_HOSTS=localhost,127.0.0.1
        
        # Database Configuration (will be overridden by docker-compose environment)
        DATABASE_URL=postgres://eventlinez:Texera123@@db:5432/eventlinez
        
        # Stripe Test Keys
        STRIPE_PUBLISHABLE_KEY=pk_test_X0l8E5nTKtSMa8fcs4983IoP00wOhfcpbC
        STRIPE_SECRET_KEY=sk_test_YHj724JNB8fMwCfcCb4ieHRU007hQB7qwU
        
        # reCAPTCHA Test Configuration
        RECAPTCHA_PUBLIC_KEY=6LdK0-ErAAAAALmLHyOhfrARGwmoAyi0N-43_XSx
        RECAPTCHA_PRIVATE_KEY=6LdK0-ErAAAAAJDF60tuza2uqVJhMunY4_kPqiz9
        RECAPTCHA_PROJECT_ID=
        
        # SendGrid (empty for testing)
        SENDGRID_API_KEY=
        
        # Application Settings
        EVENTLINEZ_FEE=0.12
        ENVIRONMENT=test
        SEED_DATA=true
        EOF

    - name: Build Docker images
      run: |
        docker compose build --no-cache

    - name: Start test environment
      run: |
        docker compose up -d

    - name: Wait for database to be ready
      run: |
        echo "Waiting for database to be ready..."
        sleep 15
        
        # Check if database is ready
        RETRIES=30
        while ! docker compose exec -T db pg_isready -U eventlinez -d eventlinez > /dev/null 2>&1; do
          RETRIES=$((RETRIES - 1))
          if [ $RETRIES -eq 0 ]; then
            echo "Database failed to start"
            docker compose logs db
            exit 1
          fi
          echo "Waiting for database... ($RETRIES attempts left)"
          sleep 2
        done
        echo "Database is ready"

    - name: Run database migrations
      run: |
        docker compose exec -T web python manage.py migrate --noinput

    - name: Run tests in Docker
      run: |
        docker compose exec -T web python manage.py test --verbosity=2

    - name: Collect static files
      run: |
        docker compose exec -T web python manage.py collectstatic --noinput --clear

    - name: Check application health
      run: |
        # Wait for application to be ready
        sleep 10
        
        # Test if application responds
        if curl -f -s http://localhost:8000/admin/ > /dev/null; then
          echo "✅ Application health check passed"
        else
          echo "❌ Application health check failed"
          echo "Container logs:"
          docker compose logs web
          exit 1
        fi

    - name: Stop test environment
      if: always()
      run: |
        docker compose down -v

  deploy-test:
    needs: test
    runs-on: ubuntu-latest
    # Only run deployment if we have the required secrets AND it's a push to develop
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push' && secrets.TEST_SERVER_SSH_KEY != ''

    steps:
    - uses: actions/checkout@v4

    - name: Check deployment prerequisites
      run: |
        echo "🔍 Checking deployment prerequisites..."
        if [ -z "${{ secrets.TEST_SERVER_SSH_KEY }}" ]; then
          echo "❌ TEST_SERVER_SSH_KEY secret is not configured"
          echo "ℹ️  To enable deployment, configure these GitHub secrets:"
          echo "   - TEST_SERVER_SSH_KEY: SSH private key for server access"
          echo "   - TEST_SERVER_HOST: Test server hostname/IP"
          echo "   - TEST_SERVER_USER: SSH username for server"
          exit 1
        fi
        echo "✅ All secrets configured"

    - name: Setup SSH for Test Server
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.TEST_SERVER_SSH_KEY }}

    - name: Add test server to known hosts
      run: |
        ssh-keyscan -H ${{ secrets.TEST_SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to Test Environment using Docker
      run: |
        ssh ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} << 'ENDSSH'
        set -e
        
        # Colors for output
        RED='\033[0;31m'
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        BLUE='\033[0;34m'
        NC='\033[0m'
        
        echo -e "${BLUE}╔════════════════════════════════════════╗${NC}"
        echo -e "${BLUE}║   Automated Test Environment Deploy   ║${NC}"
        echo -e "${BLUE}║          Using Docker Stack           ║${NC}"
        echo -e "${BLUE}╚════════════════════════════════════════╝${NC}"
        
        # Configuration
        PROJECT_DIR="/home/sunset/eventlinez"
        BACKUP_DIR="/home/sunset/backups"
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        
        # Step 1: Create backup
        echo -e "\n${BLUE}▶ Creating backup...${NC}"
        mkdir -p $BACKUP_DIR/test_$TIMESTAMP
        
        # Backup Docker volumes and database
        cd $PROJECT_DIR
        if docker compose ps -q db | xargs -r docker inspect -f '{{.State.Running}}' | grep -q true; then
            echo -e "  ${YELLOW}→ Backing up PostgreSQL database...${NC}"
            docker compose exec -T db pg_dump -U eventlinez eventlinez > $BACKUP_DIR/test_$TIMESTAMP/db_backup.sql
            echo -e "  ${GREEN}✓ Database backup complete${NC}"
        fi
        
        if [ -d "$PROJECT_DIR/media" ]; then
            cp -r $PROJECT_DIR/media $BACKUP_DIR/test_$TIMESTAMP/ 2>/dev/null || true
            echo -e "  ${GREEN}✓ Media files backup complete${NC}"
        fi
        
        # Step 2: Pull latest code from develop
        echo -e "\n${BLUE}▶ Pulling latest code from develop...${NC}"
        cd $PROJECT_DIR
        git fetch origin
        git checkout develop
        git pull origin develop
        echo -e "${GREEN}✓ Code updated${NC}"
        
        # Step 3: Create .env.docker file on server
        echo -e "\n${BLUE}▶ Creating environment configuration...${NC}"
        cat > .env.docker << 'ENVEOF'
        # Django Configuration for Test Server
        DEBUG=False
        SECRET_KEY=test-server-secret-key-change-in-production
        ALLOWED_HOSTS=localhost,127.0.0.1,test.eventlinez.com,45.79.112.247
        
        # Database Configuration
        DATABASE_URL=postgres://eventlinez:Texera123@@db:5432/eventlinez
        
        # Stripe Test Keys
        STRIPE_PUBLISHABLE_KEY=pk_test_X0l8E5nTKtSMa8fcs4983IoP00wOhfcpbC
        STRIPE_SECRET_KEY=sk_test_YHj724JNB8fMwCfcCb4ieHRU007hQB7qwU
        
        # reCAPTCHA Configuration
        RECAPTCHA_PUBLIC_KEY=6LdK0-ErAAAAALmLHyOhfrARGwmoAyi0N-43_XSx
        RECAPTCHA_PRIVATE_KEY=6LdK0-ErAAAAAJDF60tuza2uqVJhMunY4_kPqiz9
        RECAPTCHA_PROJECT_ID=
        
        # SendGrid (empty for test environment)
        SENDGRID_API_KEY=
        
        # Application Settings
        EVENTLINEZ_FEE=0.12
        ENVIRONMENT=test
        SEED_DATA=true
        ENVEOF
        echo -e "${GREEN}✓ Environment configuration created${NC}"
        
        # Step 4: Stop existing containers
        echo -e "\n${BLUE}▶ Stopping existing containers...${NC}"
        docker compose down || true
        echo -e "${GREEN}✓ Containers stopped${NC}"
        
        # Step 5: Build and start new containers
        echo -e "\n${BLUE}▶ Building and starting Docker containers...${NC}"
        docker compose build --no-cache web
        docker compose up -d
        echo -e "${GREEN}✓ Containers started${NC}"
        
        # Step 6: Wait for database to be ready
        echo -e "\n${BLUE}▶ Waiting for database to be ready...${NC}"
        sleep 15
        
        # Check if database is ready
        RETRIES=30
        while ! docker compose exec -T db pg_isready -U eventlinez -d eventlinez > /dev/null 2>&1; do
            RETRIES=$((RETRIES - 1))
            if [ $RETRIES -eq 0 ]; then
                echo -e "${RED}✗ Database failed to start${NC}"
                docker compose logs db
                exit 1
            fi
            echo -e "  ${YELLOW}→ Waiting for database... ($RETRIES attempts left)${NC}"
            sleep 2
        done
        echo -e "${GREEN}✓ Database is ready${NC}"
        
        # Step 7: Run database migrations
        echo -e "\n${BLUE}▶ Running database migrations...${NC}"
        docker compose exec -T web python manage.py migrate --noinput
        echo -e "${GREEN}✓ Migrations applied${NC}"
        
        # Step 8: Collect static files
        echo -e "\n${BLUE}▶ Collecting static files...${NC}"
        docker compose exec -T web python manage.py collectstatic --noinput --clear
        echo -e "${GREEN}✓ Static files collected${NC}"
        
        # Step 9: Clear caches
        echo -e "\n${BLUE}▶ Clearing application caches...${NC}"
        docker compose exec -T web python manage.py shell -c "from django.core.cache import cache; cache.clear()" || true
        echo -e "${GREEN}✓ Caches cleared${NC}"
        
        # Step 10: Restart containers to ensure clean state
        echo -e "\n${BLUE}▶ Restarting containers...${NC}"
        docker compose restart web
        echo -e "${GREEN}✓ Containers restarted${NC}"
        
        # Step 11: Health check
        echo -e "\n${BLUE}▶ Running health check...${NC}"
        sleep 10
        
        # Check if containers are running
        if ! docker compose ps | grep -q "Up"; then
            echo -e "${RED}✗ Some containers are not running${NC}"
            docker compose ps
            docker compose logs --tail=20
            exit 1
        fi
        
        # Check application response
        HEALTH_RETRIES=12
        while [ $HEALTH_RETRIES -gt 0 ]; do
            if curl -f -s http://localhost:8000/admin/ > /dev/null; then
                echo -e "${GREEN}✓ Health check passed${NC}"
                break
            else
                HEALTH_RETRIES=$((HEALTH_RETRIES - 1))
                if [ $HEALTH_RETRIES -eq 0 ]; then
                    echo -e "${RED}✗ Health check failed${NC}"
                    echo -e "${YELLOW}Container status:${NC}"
                    docker compose ps
                    echo -e "${YELLOW}Application logs:${NC}"
                    docker compose logs --tail=20 web
                    exit 1
                fi
                echo -e "  ${YELLOW}→ Health check attempt $((13-HEALTH_RETRIES))/12...${NC}"
                sleep 5
            fi
        done
        
        # Step 12: Setup nginx proxy if needed
        echo -e "\n${BLUE}▶ Checking nginx configuration...${NC}"
        if systemctl is-active --quiet nginx; then
            sudo systemctl reload nginx
            echo -e "  ${GREEN}✓ Nginx reloaded${NC}"
        else
            echo -e "  ${YELLOW}→ Nginx not running, skipping${NC}"
        fi
        
        # Step 13: Clean up old Docker images
        echo -e "\n${BLUE}▶ Cleaning up old Docker images...${NC}"
        docker image prune -f > /dev/null 2>&1 || true
        echo -e "${GREEN}✓ Cleanup complete${NC}"
        
        echo -e "\n${GREEN}╔════════════════════════════════════════╗${NC}"
        echo -e "${GREEN}║   Test Environment Deploy Complete!   ║${NC}"
        echo -e "${GREEN}╚════════════════════════════════════════╝${NC}"
        echo ""
        echo "Test URL: http://test.eventlinez.com"
        echo "Direct URL: http://45.79.112.247:8000"
        echo "Backup: $BACKUP_DIR/test_$TIMESTAMP"
        echo ""
        echo "Container Status:"
        docker compose ps
        echo ""
        
        ENDSSH

    - name: Notify test deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Docker-based test environment deployment successful!"
          echo "🐳 Application running in containers"
          echo "🔗 Test URL: http://test.eventlinez.com"
        else
          echo "❌ Docker-based test environment deployment failed!"
        fi