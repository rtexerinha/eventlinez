name: Test and Deploy

on:
  push:
    branches: [ develop, main, master ]
  pull_request:
    branches: [ develop, main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create .env.docker file for testing
      run: |
        cat > .env.docker << 'EOF'
        # Django Configuration for Testing
        DEBUG=True
        SECRET_KEY=test-secret-key-for-ci-cd-pipeline
        ALLOWED_HOSTS=localhost,127.0.0.1
        
        # Database Configuration (will be overridden by docker-compose environment)
        DATABASE_URL=postgres://eventlinez:Texera123@@db:5432/eventlinez
        
        # Stripe Test Keys
        STRIPE_PUBLISHABLE_KEY=pk_test_X0l8E5nTKtSMa8fcs4983IoP00wOhfcpbC
        STRIPE_SECRET_KEY=sk_test_YHj724JNB8fMwCfcCb4ieHRU007hQB7qwU
        
        # reCAPTCHA Test Configuration
        RECAPTCHA_PUBLIC_KEY=6LdK0-ErAAAAALmLHyOhfrARGwmoAyi0N-43_XSx
        RECAPTCHA_PRIVATE_KEY=6LdK0-ErAAAAAJDF60tuza2uqVJhMunY4_kPqiz9
        RECAPTCHA_PROJECT_ID=
        
        # SendGrid (empty for testing)
        SENDGRID_API_KEY=
        
        # Application Settings
        EVENTLINEZ_FEE=0.12
        ENVIRONMENT=test
        SEED_DATA=true
        EOF

    - name: Build Docker images
      run: |
        docker compose build --no-cache

    - name: Start test environment
      run: |
        docker compose up -d

    - name: Wait for database to be ready
      run: |
        echo "Waiting for database to be ready..."
        sleep 15
        
        # Check if database is ready
        RETRIES=30
        while ! docker compose exec -T db pg_isready -U eventlinez -d eventlinez > /dev/null 2>&1; do
          RETRIES=$((RETRIES - 1))
          if [ $RETRIES -eq 0 ]; then
            echo "Database failed to start"
            docker compose logs db
            exit 1
          fi
          echo "Waiting for database... ($RETRIES attempts left)"
          sleep 2
        done
        echo "Database is ready"

    - name: Run database migrations
      run: |
        docker compose exec -T web python manage.py migrate --noinput

    - name: Run tests in Docker
      run: |
        docker compose exec -T web python manage.py test --verbosity=2

    - name: Collect static files
      run: |
        docker compose exec -T web python manage.py collectstatic --noinput --clear

    - name: Check application health
      run: |
        # Wait for application to be ready
        sleep 10
        
        # Test if application responds
        if curl -f -s http://localhost:8000/admin/ > /dev/null; then
          echo "✅ Application health check passed"
        else
          echo "❌ Application health check failed"
          echo "Container logs:"
          docker compose logs web
          exit 1
        fi

    - name: Stop test environment
      if: always()
      run: |
        docker compose down -v

    - name: Test Results Summary
      run: |
        echo "🧪 Test Results Summary:"
        echo "✅ Docker build completed"
        echo "✅ Database migrations successful" 
        echo "✅ All tests passed"
        echo "✅ Static files collected"
        echo "✅ Application health check passed"

  deploy-test:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Get commit info
      id: commit
      run: echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Check deployment prerequisites
      run: |
        if [ -z "${{ secrets.TEST_SERVER_HOST }}" ] || [ -z "${{ secrets.TEST_SERVER_USER }}" ] || [ -z "${{ secrets.TEST_SERVER_PASSWORD }}" ]; then
          echo "❌ Server connection secrets not configured"
          exit 1
        else
          echo "✅ Server connection secrets configured. Proceeding with deployment."
        fi

    - name: Install sshpass
      run: sudo apt-get update && sudo apt-get install -y sshpass

    - name: Add server to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.TEST_SERVER_HOST }} >> ~/.ssh/known_hosts
        echo "✅ SSH connection setup completed"

    - name: Deploy with Docker to test server
      run: |
        echo "🚀 Starting deployment to test server..."
        echo "📋 Deployment Info:"
        echo "   - Commit: $(git rev-parse --short HEAD)"
        echo "   - Branch: ${GITHUB_REF#refs/heads/}"
        echo "   - Message: $(git log -1 --pretty=%B | head -n1)"
        echo "   - Time: $(date '+%Y-%m-%d %H:%M:%S')"
        
        # Execute deployment on server
        sshpass -p "${{ secrets.TEST_SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} << 'DEPLOY_EOF'
        set -e
        
        echo "🔍 Checking deployment options..."
        PROJECT_DIR="/home/sunset/eventlinez"
        cd $PROJECT_DIR
        
        # Check if Docker is available
        if command -v docker &> /dev/null && groups | grep -q docker; then
          echo "🐳 Docker is available - using Docker deployment"
          
          # Docker deployment
          docker-compose down 2>/dev/null || docker compose down 2>/dev/null || true
          
          git fetch origin
          git checkout develop
          git pull origin develop
          
          # Create Docker environment file
          cat > .env.docker << 'DOCKER_ENV_EOF'
DEBUG=False
SECRET_KEY=test-server-secret-key-change-in-production
ALLOWED_HOSTS=localhost,127.0.0.1,test.eventlinez.com,45.79.112.247
DATABASE_URL=postgres://eventlinez:Texera123@@db:5432/eventlinez
STRIPE_PUBLISHABLE_KEY=pk_test_X0l8E5nTKtSMa8fcs4983IoP00wOhfcpbC
STRIPE_SECRET_KEY=sk_test_YHj724JNB8fMwCfcCb4ieHRU007hQB7qwU
RECAPTCHA_PUBLIC_KEY=6LdK0-ErAAAAALmLHyOhfrARGwmoAyi0N-43_XSx
RECAPTCHA_PRIVATE_KEY=6LdK0-ErAAAAAJDF60tuza2uqVJhMunY4_kPqiz9
RECAPTCHA_PROJECT_ID=
SENDGRID_API_KEY=
EVENTLINEZ_FEE=0.12
ENVIRONMENT=test
SEED_DATA=true
DOCKER_ENV_EOF
          
          if command -v docker-compose &> /dev/null; then
            docker-compose build --no-cache web
            docker-compose up -d
            sleep 30
            docker-compose exec -T web python manage.py migrate --noinput
            docker-compose exec -T web python manage.py collectstatic --noinput --clear
          else
            docker compose build --no-cache web
            docker compose up -d
            sleep 30
            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py collectstatic --noinput --clear
          fi
          
          echo "✅ Docker deployment completed"
          
        else
          echo "🐍 Docker not available - using Python virtual environment deployment"
          
          # Stop any existing processes
          pkill -f "gunicorn.*eventlinez" || true
          pkill -f "python.*manage.py.*runserver" || true
          sleep 2
          
          # Pull latest code
          git fetch origin
          git checkout develop  
          git pull origin develop
          
          # Setup Python virtual environment
          if [ ! -d "venv" ]; then
            echo "Creating Python virtual environment..."
            python3 -m venv venv
          fi
          
          source venv/bin/activate
          
          # Upgrade pip to compatible version for celery
          pip install "pip<24.1"
          
          # Install dependencies with fallback strategy
          echo "Installing Python dependencies..."
          if pip install -r requirements.txt; then
            echo "✅ Dependencies installed successfully"
          else
            echo "⚠️ Main installation failed, trying fallback approach..."
            
            # Create requirements without problematic packages
            echo "Creating fallback requirements file..."
            cat requirements.txt | grep -v -E "(celery|sshtunnel|paramiko|bcrypt|cryptography)" > requirements_core.txt || {
              # If grep fails, create core requirements manually
              cat > requirements_core.txt << 'CORE_REQUIREMENTS_EOF'
django==3.2.25
djangorestframework==3.14.0
psycopg2-binary==2.9.8
django-crispy-forms==1.13.0
django-ckeditor==6.0.0
django-imagekit==5.0.0
pillow>=8.0.0,<10.0.0
stripe==2.58.0
sentry-sdk<2.0.0
xlsxwriter==1.4.4
django-bootstrap-datepicker-plus==4.0.0
python-dotenv<1.0.0
dj-database-url<2.0.0
qrcode==7.2
reportlab==3.5.68
gunicorn>=20,<22
whitenoise==5.3.0
requests>=2.25.0,<3.0.0
model-bakery==1.5.0
PyPDF2==2.12.1
CORE_REQUIREMENTS_EOF
            }
            
            # Install core dependencies
            echo "Installing core dependencies..."
            pip install -r requirements_core.txt
            
            # Try to install compatible versions of problematic packages
            echo "Installing compatible versions of additional packages..."
            
            # Install SSH tunnel support with compatible versions
            pip install "paramiko>=2.7.2,<3.0.0" "sshtunnel>=0.4.0" || {
              echo "⚠️ SSH tunnel packages failed, trying older versions..."
              pip install "paramiko==2.7.2" "sshtunnel==0.4.0" || echo "SSH tunnel support not available"
            }
            
            # Install compatible celery version
            pip install "celery==4.4.6" || pip install "celery>=4.0.0,<5.0.0" || echo "⚠️ Celery not available"
            
            # Install compatible crypto packages
            pip install "cryptography>=3.4.8,<4.0.0" "bcrypt>=3.2.0,<4.0.0" || echo "⚠️ Some crypto packages may not be available"
            
            # Clean up
            rm requirements_core.txt 2>/dev/null || true
            
            echo "✅ Fallback installation completed"
          fi
          
          # Create environment file
          cat > .env << 'VENV_ENV_EOF'
DEBUG=False
SECRET_KEY=test-server-secret-key-change-in-production
ALLOWED_HOSTS=localhost,127.0.0.1,test.eventlinez.com,45.79.112.247
DATABASE_URL=sqlite:///db.sqlite3
STRIPE_PUBLISHABLE_KEY=pk_test_X0l8E5nTKtSMa8fcs4983IoP00wOhfcpbC
STRIPE_SECRET_KEY=sk_test_YHj724JNB8fMwCfcCb4ieHRU007hQB7qwU
RECAPTCHA_PUBLIC_KEY=6LdK0-ErAAAAALmLHyOhfrARGwmoAyi0N-43_XSx
RECAPTCHA_PRIVATE_KEY=6LdK0-ErAAAAAJDF60tuza2uqVJhMunY4_kPqiz9
RECAPTCHA_PROJECT_ID=
SENDGRID_API_KEY=
EVENTLINEZ_FEE=0.12
ENVIRONMENT=test
SEED_DATA=true
VENV_ENV_EOF
          
          # Run Django management commands
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput --clear
          
          # Start the application with gunicorn
          echo "Starting application with gunicorn..."
          nohup gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 eventlinez.wsgi:application > /tmp/django.log 2>&1 &
          
          # Wait for application to start
          sleep 10
          
          echo "✅ Python virtual environment deployment completed"
        fi
        
        # Final health check
        echo "🔍 Performing health check..."
        sleep 5
        if curl -f -s http://localhost:8000/ > /dev/null 2>&1; then
          echo "✅ Application is responding successfully"
        else
          echo "⚠️ Application may still be starting up"
          if [ -f /tmp/django.log ]; then
            echo "📋 Recent application logs:"
            tail -10 /tmp/django.log
          fi
        fi
        
        echo "🎉 Deployment completed successfully!"
        DEPLOY_EOF

    - name: Verify deployment
      run: |
        echo "🔍 Verifying deployment..."
        
        # Wait for application to be fully ready
        sleep 20
        
        # Test site accessibility
        RETRIES=5
        ACCESSIBLE=false
        for i in $(seq 1 $RETRIES); do
          if curl -f -s --max-time 10 http://45.79.112.247:8000/ > /dev/null 2>&1; then
            echo "✅ Site is accessible"
            ACCESSIBLE=true
            break
          fi
          echo "Attempt $i/$RETRIES failed, waiting..."
          sleep 10
        done
        
        if [ "$ACCESSIBLE" = "false" ]; then
          echo "❌ Site is not accessible after $RETRIES attempts"
          # Check server status
          sshpass -p "${{ secrets.TEST_SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} "
            echo 'Container status:'
            docker-compose ps 2>/dev/null || docker compose ps 2>/dev/null || echo 'No containers running'
            echo 'Application logs:'
            docker-compose logs --tail=20 web 2>/dev/null || docker compose logs --tail=20 web 2>/dev/null || echo 'No logs available'
          "
          exit 1
        fi

    - name: Deployment Results
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment to test.eventlinez.com completed successfully!"
          echo "🌐 Site: http://test.eventlinez.com/"
          echo "🌐 Direct: http://45.79.112.247:8000/"
          echo "📊 Commit: $(git rev-parse --short HEAD)"
          echo "⏰ Time: $(date '+%Y-%m-%d %H:%M:%S')"
        else
          echo "❌ Deployment to test.eventlinez.com failed!"
          echo "Please check the deployment logs above for details."
        fi