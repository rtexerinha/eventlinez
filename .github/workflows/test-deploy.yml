name: Test and Deploy

on:
  push:
    branches: [ develop, main, master ]
  pull_request:
    branches: [ develop, main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create .env.docker file for testing
      run: |
        cat > .env.docker << 'EOF'
        # Django Configuration for Testing
        DEBUG=True
        SECRET_KEY=test-secret-key-for-ci-cd-pipeline
        ALLOWED_HOSTS=localhost,127.0.0.1
        
        # Database Configuration (will be overridden by docker-compose environment)
        DATABASE_URL=postgres://eventlinez:Texera123@@db:5432/eventlinez
        
        # Stripe Test Keys
        STRIPE_PUBLISHABLE_KEY=pk_test_X0l8E5nTKtSMa8fcs4983IoP00wOhfcpbC
        STRIPE_SECRET_KEY=sk_test_YHj724JNB8fMwCfcCb4ieHRU007hQB7qwU
        
        # reCAPTCHA Test Configuration
        RECAPTCHA_PUBLIC_KEY=6LdK0-ErAAAAALmLHyOhfrARGwmoAyi0N-43_XSx
        RECAPTCHA_PRIVATE_KEY=6LdK0-ErAAAAAJDF60tuza2uqVJhMunY4_kPqiz9
        RECAPTCHA_PROJECT_ID=
        
        # SendGrid (empty for testing)
        SENDGRID_API_KEY=
        
        # Application Settings
        EVENTLINEZ_FEE=0.12
        ENVIRONMENT=test
        SEED_DATA=true
        EOF

    - name: Build Docker images
      run: |
        docker compose build --no-cache

    - name: Start test environment
      run: |
        docker compose up -d

    - name: Wait for database to be ready
      run: |
        echo "Waiting for database to be ready..."
        sleep 15
        
        # Check if database is ready
        RETRIES=30
        while ! docker compose exec -T db pg_isready -U eventlinez -d eventlinez > /dev/null 2>&1; do
          RETRIES=$((RETRIES - 1))
          if [ $RETRIES -eq 0 ]; then
            echo "Database failed to start"
            docker compose logs db
            exit 1
          fi
          echo "Waiting for database... ($RETRIES attempts left)"
          sleep 2
        done
        echo "Database is ready"

    - name: Run database migrations
      run: |
        docker compose exec -T web python manage.py migrate --noinput

    - name: Run tests in Docker
      run: |
        docker compose exec -T web python manage.py test --verbosity=2

    - name: Collect static files
      run: |
        docker compose exec -T web python manage.py collectstatic --noinput --clear

    - name: Check application health
      run: |
        # Wait for application to be ready
        sleep 10
        
        # Test if application responds
        if curl -f -s http://localhost:8000/admin/ > /dev/null; then
          echo "✅ Application health check passed"
        else
          echo "❌ Application health check failed"
          echo "Container logs:"
          docker compose logs web
          exit 1
        fi

    - name: Stop test environment
      if: always()
      run: |
        docker compose down -v

    - name: Test Results Summary
      run: |
        echo "🧪 Test Results Summary:"
        echo "✅ Docker build completed"
        echo "✅ Database migrations successful" 
        echo "✅ All tests passed"
        echo "✅ Static files collected"
        echo "✅ Application health check passed"

  deploy-test:
    needs: test
    runs-on: ubuntu-latest
    # Only deploy to test server on develop branch pushes (not PRs)
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Get commit info
      id: commit
      run: echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Check deployment prerequisites
      run: |
        if [ -z "${{ secrets.TEST_SERVER_HOST }}" ] || [ -z "${{ secrets.TEST_SERVER_USER }}" ] || [ -z "${{ secrets.TEST_SERVER_PASSWORD }}" ]; then
          echo "❌ Server connection secrets not configured"
          exit 1
        else
          echo "✅ Server connection secrets configured. Proceeding with deployment."
        fi

    - name: Install sshpass
      run: sudo apt-get update && sudo apt-get install -y sshpass

    - name: Add server to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.TEST_SERVER_HOST }} >> ~/.ssh/known_hosts
        echo "✅ SSH connection setup completed"

    - name: Create deployment script
      run: |
        cat > deploy_script.sh << 'SCRIPT_EOF'
        #!/bin/bash
        set -e
        
        # Colors for output
        RED='\033[0;31m'
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        BLUE='\033[0;34m'
        NC='\033[0m'
        
        echo -e "${BLUE}╔════════════════════════════════════════╗${NC}"
        echo -e "${BLUE}║   Automated Test Environment Deploy   ║${NC}"
        echo -e "${BLUE}║       Using Python Virtual Env        ║${NC}"
        echo -e "${BLUE}╚════════════════════════════════════════╝${NC}"
        
        # Configuration
        PROJECT_DIR="/home/sunset/eventlinez"
        BACKUP_DIR="/home/sunset/backups"
        VENV_DIR="/home/sunset/eventlinez/venv"
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        
        # Step 1: Navigate to project directory
        cd $PROJECT_DIR
        
        # Step 2: Create backup
        echo -e "\n${BLUE}▶ Creating backup...${NC}"
        mkdir -p $BACKUP_DIR/test_$TIMESTAMP
        
        # Backup database if exists
        if [ -f "db.sqlite3" ]; then
            echo -e "  ${YELLOW}→ Backing up SQLite database...${NC}"
            cp db.sqlite3 $BACKUP_DIR/test_$TIMESTAMP/ 2>/dev/null || true
            echo -e "  ${GREEN}✓ Database backup complete${NC}"
        fi
        
        # Backup media files
        if [ -d "$PROJECT_DIR/media" ]; then
            cp -r $PROJECT_DIR/media $BACKUP_DIR/test_$TIMESTAMP/ 2>/dev/null || true
            echo -e "  ${GREEN}✓ Media files backup complete${NC}"
        fi
        
        # Step 3: Stop any existing processes (if using gunicorn/supervisord)
        echo -e "\n${BLUE}▶ Stopping existing processes...${NC}"
        pkill -f "gunicorn" 2>/dev/null || true
        pkill -f "python.*manage.py.*runserver" 2>/dev/null || true
        echo -e "${GREEN}✓ Processes stopped${NC}"
        
        # Step 4: Pull latest code from develop
        echo -e "\n${BLUE}▶ Pulling latest code from develop...${NC}"
        git fetch origin
        git checkout develop
        git pull origin develop
        echo -e "${GREEN}✓ Code updated${NC}"
        
        # Step 5: Setup Python virtual environment
        echo -e "\n${BLUE}▶ Setting up Python virtual environment...${NC}"
        
        # Check if virtual environment exists and pip works
        if [ -d "$VENV_DIR" ]; then
            echo -e "  ${YELLOW}→ Checking existing virtual environment...${NC}"
            if ! $VENV_DIR/bin/pip --version > /dev/null 2>&1; then
                echo -e "  ${YELLOW}→ Virtual environment is broken, recreating...${NC}"
                rm -rf $VENV_DIR
                python3 -m venv $VENV_DIR
                echo -e "  ${GREEN}✓ New virtual environment created${NC}"
            else
                echo -e "  ${GREEN}✓ Existing virtual environment is working${NC}"
            fi
        else
            echo -e "  ${YELLOW}→ Creating new virtual environment...${NC}"
            python3 -m venv $VENV_DIR
            echo -e "  ${GREEN}✓ New virtual environment created${NC}"
        fi
        
        # Activate virtual environment
        source $VENV_DIR/bin/activate
        echo -e "  ${GREEN}✓ Virtual environment activated${NC}"
        
        # Ensure pip is working
        if ! pip --version > /dev/null 2>&1; then
            echo -e "  ${YELLOW}→ Reinstalling pip in virtual environment...${NC}"
            python -m ensurepip --upgrade
            python -m pip install --upgrade pip
        fi
        
        # Step 6: Update pip and install requirements
        echo -e "\n${BLUE}▶ Installing Python dependencies...${NC}"
        pip install --upgrade pip
        pip install -r requirements.txt
        echo -e "${GREEN}✓ Dependencies installed${NC}"
        
        # Step 7: Create .env file for production
        echo -e "\n${BLUE}▶ Creating environment configuration...${NC}"
        cat > .env << 'ENVEOF'
        # Django Configuration for Test Server
        DEBUG=False
        SECRET_KEY=test-server-secret-key-change-in-production
        ALLOWED_HOSTS=localhost,127.0.0.1,test.eventlinez.com,45.79.112.247
        
        # Database Configuration (SQLite for test server)
        DATABASE_URL=sqlite:///db.sqlite3
        
        # Stripe Test Keys
        STRIPE_PUBLISHABLE_KEY=pk_test_X0l8E5nTKtSMa8fcs4983IoP00wOhfcpbC
        STRIPE_SECRET_KEY=sk_test_YHj724JNB8fMwCfcCb4ieHRU007hQB7qwU
        
        # reCAPTCHA Configuration
        RECAPTCHA_PUBLIC_KEY=6LdK0-ErAAAAALmLHyOhfrARGwmoAyi0N-43_XSx
        RECAPTCHA_PRIVATE_KEY=6LdK0-ErAAAAAJDF60tuza2uqVJhMunY4_kPqiz9
        RECAPTCHA_PROJECT_ID=
        
        # SendGrid (empty for test environment)
        SENDGRID_API_KEY=
        
        # Application Settings
        EVENTLINEZ_FEE=0.12
        ENVIRONMENT=test
        SEED_DATA=true
        ENVEOF
        echo -e "${GREEN}✓ Environment configuration created${NC}"
        
        # Step 8: Run database migrations
        echo -e "\n${BLUE}▶ Running database migrations...${NC}"
        python manage.py migrate --noinput
        echo -e "${GREEN}✓ Migrations applied${NC}"
        
        # Step 9: Collect static files
        echo -e "\n${BLUE}▶ Collecting static files...${NC}"
        python manage.py collectstatic --noinput --clear
        echo -e "${GREEN}✓ Static files collected${NC}"
        
        # Step 10: Clear caches
        echo -e "\n${BLUE}▶ Clearing application caches...${NC}"
        python manage.py shell -c "from django.core.cache import cache; cache.clear()" 2>/dev/null || true
        echo -e "${GREEN}✓ Caches cleared${NC}"
        
        # Step 11: Start the application
        echo -e "\n${BLUE}▶ Starting the application...${NC}"
        
        # Check if gunicorn is available and start with it, otherwise use runserver
        if command -v gunicorn &> /dev/null; then
            echo -e "  ${YELLOW}→ Starting with Gunicorn...${NC}"
            nohup gunicorn eventlinez.wsgi:application --bind 0.0.0.0:8000 --workers 2 --daemon --pid /tmp/gunicorn.pid 2>&1 || true
        else
            echo -e "  ${YELLOW}→ Starting with Django runserver...${NC}"
            nohup python manage.py runserver 0.0.0.0:8000 > /tmp/django.log 2>&1 &
            echo $! > /tmp/django.pid
        fi
        
        echo -e "${GREEN}✓ Application started${NC}"
        
        # Step 12: Health check
        echo -e "\n${BLUE}▶ Running health check...${NC}"
        sleep 10
        
        # Check application response
        HEALTH_RETRIES=12
        while [ $HEALTH_RETRIES -gt 0 ]; do
            if curl -f -s http://localhost:8000/admin/ > /dev/null 2>&1; then
                echo -e "${GREEN}✓ Health check passed${NC}"
                break
            else
                HEALTH_RETRIES=$((HEALTH_RETRIES - 1))
                if [ $HEALTH_RETRIES -eq 0 ]; then
                    echo -e "${RED}✗ Health check failed${NC}"
                    echo -e "${YELLOW}Application may still be starting up${NC}"
                    if [ -f "/tmp/django.log" ]; then
                        echo -e "${YELLOW}Django logs:${NC}"
                        tail -20 /tmp/django.log || true
                    fi
                else
                    echo -e "  ${YELLOW}→ Health check attempt $((13-HEALTH_RETRIES))/12...${NC}"
                    sleep 5
                fi
            fi
        done
        
        # Step 13: Setup nginx proxy if needed
        echo -e "\n${BLUE}▶ Checking nginx configuration...${NC}"
        if command -v nginx &> /dev/null && systemctl is-active --quiet nginx 2>/dev/null; then
            sudo systemctl reload nginx 2>/dev/null || true
            echo -e "  ${GREEN}✓ Nginx reloaded${NC}"
        else
            echo -e "  ${YELLOW}→ Nginx not available, application running on port 8000${NC}"
        fi
        
        echo -e "\n${GREEN}╔════════════════════════════════════════╗${NC}"
        echo -e "${GREEN}║   Test Environment Deploy Complete!   ║${NC}"
        echo -e "${GREEN}╚════════════════════════════════════════╝${NC}"
        echo ""
        echo "Test URL: http://test.eventlinez.com"
        echo "Direct URL: http://45.79.112.247:8000"
        echo "Backup: $BACKUP_DIR/test_$TIMESTAMP"
        echo ""
        echo "Application Status:"
        if pgrep -f "gunicorn\|runserver" > /dev/null; then
            echo "✅ Application is running"
            pgrep -f "gunicorn\|runserver" | head -5
        else
            echo "⚠️ Application process not found"
        fi
        echo ""
        
        SCRIPT_EOF

    - name: Deploy to test server
      run: |
        echo "🚀 Starting deployment to test server..."
        echo "📋 Deployment Info:"
        echo "   - Commit: $(git rev-parse --short HEAD)"
        echo "   - Branch: ${GITHUB_REF#refs/heads/}"
        echo "   - Message: $(git log -1 --pretty=%B | head -n1)"
        echo "   - Time: $(date '+%Y-%m-%d %H:%M:%S')"
        
        # Copy deployment script to server
        sshpass -p "${{ secrets.TEST_SERVER_PASSWORD }}" scp -o StrictHostKeyChecking=no deploy_script.sh ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }}:/tmp/deploy_script.sh
        
        # Execute deployment script on server
        sshpass -p "${{ secrets.TEST_SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} "chmod +x /tmp/deploy_script.sh && /tmp/deploy_script.sh && rm /tmp/deploy_script.sh"

    - name: Verify deployment
      run: |
        echo "🔍 Verifying deployment..."
        
        # Verify git repository state on server
        sshpass -p "${{ secrets.TEST_SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} << 'VERIFY_EOF'
        echo "🔄 Verifying git repository state on test server..."
        cd /home/sunset/eventlinez
        
        echo "📥 Fetching latest changes..."
        git fetch origin
        
        echo "⬇️ Pulling from develop branch..."
        git pull origin develop
        echo "✅ Git repository updated"
        
        echo "Current commit on server: $(git rev-parse HEAD)"
        echo "Expected commit: ${{ steps.commit.outputs.commit_sha }}"
        
        if [ "$(git rev-parse HEAD)" = "${{ steps.commit.outputs.commit_sha }}" ]; then
            echo "✅ Git commit verification successful"
        else
            echo "❌ Git commit verification failed"
            exit 1
        fi
        
        echo "📋 Latest commit info:"
        git log -1 --oneline
        
        echo "📂 Current branch: $(git branch --show-current 2>/dev/null || git symbolic-ref --short HEAD 2>/dev/null || echo 'detached')"
        echo "🔗 Remote tracking: $(git branch -vv | grep '^\*' | sed 's/.*\[\([^]]*\)\].*/\1/' || echo 'none')"
        VERIFY_EOF
        
        # Test if the site is accessible
        if curl -f -s https://test.eventlinez.com/ > /dev/null; then
            echo "✅ Public site is accessible"
        else
            echo "⚠️ Site may not be accessible via HTTPS, checking HTTP..."
            if curl -f -s http://45.79.112.247:8000/ > /dev/null; then
                echo "✅ Site accessible via direct IP"
            else
                echo "❌ Site not accessible"
                exit 1
            fi
        fi
        
        # Check version endpoint if available
        if curl -f -s https://test.eventlinez.com/version/ > /dev/null; then
            echo "✅ Version info is accessible"
            curl -s https://test.eventlinez.com/version/ || true
        else
            echo "ℹ️ Version endpoint not available"
        fi

    - name: Deployment Results
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment to test.eventlinez.com completed successfully!"
          echo "🌐 Site: https://test.eventlinez.com/"
          echo "📊 Commit: $(git rev-parse --short HEAD)"
          echo "⏰ Time: $(date '+%Y-%m-%d %H:%M:%S')"
        else
          echo "❌ Deployment to test.eventlinez.com failed!"
          echo "Please check the deployment logs above for details."
        fi