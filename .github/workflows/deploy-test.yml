name: Deploy to Test Environment

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_eventlinez
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage

    - name: Set up environment variables
      run: |
        echo "DEBUG=True" >> .env
        echo "SECRET_KEY=test-secret-key-for-ci" >> .env
        echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/test_eventlinez" >> .env
        echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env

    - name: Run migrations
      run: |
        python manage.py migrate

    - name: Run tests
      run: |
        coverage run --source='.' manage.py test
        coverage report
        coverage xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  deploy-test:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
    - uses: actions/checkout@v4

    - name: Setup SSH for Test Server
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.TEST_SSH_KEY }}

    - name: Add test server to known hosts
      run: |
        ssh-keyscan -H ${{ secrets.TEST_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to Test Environment
      run: |
        ssh ${{ secrets.TEST_USER }}@${{ secrets.TEST_HOST }} << 'ENDSSH'
        set -e
        
        # Colors for output
        RED='\033[0;31m'
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        BLUE='\033[0;34m'
        NC='\033[0m'
        
        echo -e "${BLUE}╔════════════════════════════════════════╗${NC}"
        echo -e "${BLUE}║    Automated Test Environment Deploy  ║${NC}"
        echo -e "${BLUE}╚════════════════════════════════════════╝${NC}"
        
        # Configuration
        PROJECT_DIR="/home/sunset/eventlinez"
        BACKUP_DIR="/home/sunset/backups"
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        
        # Step 1: Create backup
        echo -e "\n${BLUE}▶ Creating backup...${NC}"
        mkdir -p $BACKUP_DIR/test_$TIMESTAMP
        
        if [ -f "$PROJECT_DIR/db.sqlite3" ]; then
            cp $PROJECT_DIR/db.sqlite3 $BACKUP_DIR/test_$TIMESTAMP/
            echo -e "  ${GREEN}✓ Database backup complete${NC}"
        fi
        
        if [ -d "$PROJECT_DIR/media" ]; then
            cp -r $PROJECT_DIR/media $BACKUP_DIR/test_$TIMESTAMP/ 2>/dev/null || true
            echo -e "  ${GREEN}✓ Media files backup complete${NC}"
        fi
        
        # Step 2: Pull latest code from develop
        echo -e "\n${BLUE}▶ Pulling latest code from develop...${NC}"
        cd $PROJECT_DIR
        git fetch origin
        git checkout develop
        git pull origin develop
        echo -e "${GREEN}✓ Code updated${NC}"
        
        # Step 3: Activate virtual environment and update dependencies
        echo -e "\n${BLUE}▶ Updating dependencies...${NC}"
        source venv/bin/activate
        pip install --upgrade pip -q
        pip install -r requirements.txt -q
        echo -e "${GREEN}✓ Dependencies updated${NC}"
        
        # Step 4: Run database migrations
        echo -e "\n${BLUE}▶ Running database migrations...${NC}"
        python manage.py migrate --noinput
        echo -e "${GREEN}✓ Migrations applied${NC}"
        
        # Step 5: Collect static files
        echo -e "\n${BLUE}▶ Collecting static files...${NC}"
        python manage.py collectstatic --noinput --clear
        echo -e "${GREEN}✓ Static files collected${NC}"
        
        # Step 6: Clear caches
        echo -e "\n${BLUE}▶ Clearing caches...${NC}"
        python manage.py shell -c "from django.core.cache import cache; cache.clear()" || true
        find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
        find . -name "*.pyc" -delete 2>/dev/null || true
        echo -e "${GREEN}✓ Caches cleared${NC}"
        
        # Step 7: Restart test service
        echo -e "\n${BLUE}▶ Restarting test service...${NC}"
        if systemctl is-active --quiet eventlinez.service; then
            sudo systemctl restart eventlinez.service
            echo -e "  ${GREEN}✓ Eventlinez service restarted${NC}"
        else
            sudo systemctl start eventlinez.service
            echo -e "  ${GREEN}✓ Eventlinez service started${NC}"
        fi
        
        if systemctl is-active --quiet nginx; then
            sudo systemctl reload nginx
            echo -e "  ${GREEN}✓ Nginx reloaded${NC}"
        fi
        
        # Step 8: Health check
        echo -e "\n${BLUE}▶ Running health check...${NC}"
        sleep 10
        
        if curl -f -s http://localhost:8000/admin/ > /dev/null; then
            echo -e "${GREEN}✓ Health check passed${NC}"
        else
            echo -e "${RED}✗ Health check failed${NC}"
            sudo journalctl -u eventlinez.service --no-pager -n 10
        fi
        
        echo -e "\n${GREEN}╔════════════════════════════════════════╗${NC}"
        echo -e "${GREEN}║   Test Environment Deploy Complete!   ║${NC}"
        echo -e "${GREEN}╚════════════════════════════════════════╝${NC}"
        echo ""
        echo "Test URL: http://test.eventlinez.com"
        echo "Backup: $BACKUP_DIR/test_$TIMESTAMP"
        echo ""
        
        ENDSSH

    - name: Notify test deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Test environment deployment successful!"
        else
          echo "❌ Test environment deployment failed!"
        fi
