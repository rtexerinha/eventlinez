name: Deploy to Test Server

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

env:
  PYTHON_VERSION: 3.9
  NODE_VERSION: 16

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_eventlinez
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_dev.txt
    
    - name: Run tests
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_eventlinez
        SECRET_KEY: test-secret-key-for-github-actions
        DEBUG: False
      run: |
        python manage.py collectstatic --noinput
        python manage.py migrate --noinput
        # Create views safely after migrations (PostgreSQL only)
        python manage.py create_sales_view --force || true
        python manage.py test
    
    - name: Run linting
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check SSH Configuration
      id: check_ssh
      run: |
        if [ -z "${{ secrets.TEST_SERVER_HOST }}" ] || [ -z "${{ secrets.TEST_SERVER_USER }}" ] || [ -z "${{ secrets.DEPLOY_PATH }}" ]; then
          echo "🔑 Server connection secrets not configured. Skipping deployment."
          echo "📋 To enable automatic deployment, add these secrets to your GitHub repository:"
          echo "   - TEST_SERVER_HOST" 
          echo "   - TEST_SERVER_USER"
          echo "   - DEPLOY_PATH"
          echo "   - TEST_SERVER_PASSWORD (for password auth)"
          echo "deployment_enabled=false" >> $GITHUB_OUTPUT
        else
          echo "✅ Server connection secrets configured. Proceeding with deployment."
          echo "deployment_enabled=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Setup SSH Connection
      if: steps.check_ssh.outputs.deployment_enabled == 'true'
      run: |
        # Install sshpass for password authentication
        sudo apt-get update && sudo apt-get install -y sshpass
        
        # Setup known_hosts
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.TEST_SERVER_HOST }} >> ~/.ssh/known_hosts
        
        echo "✅ SSH connection setup completed"
    
    - name: Deploy to Test Server
      if: steps.check_ssh.outputs.deployment_enabled == 'true'
      env:
        TEST_SERVER_HOST: ${{ secrets.TEST_SERVER_HOST }}
        TEST_SERVER_USER: ${{ secrets.TEST_SERVER_USER }}
        TEST_SERVER_PASSWORD: ${{ secrets.TEST_SERVER_PASSWORD }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      run: |
        sshpass -p "$TEST_SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $TEST_SERVER_USER@$TEST_SERVER_HOST << 'EOF'
          set -e
          
          echo "🚀 Starting deployment to test server..."
          
          # Navigate to application directory
          cd ${{ secrets.DEPLOY_PATH }}/eventlinez
          
          # Stop application services
          echo "⏹️ Stopping services..."
          systemctl --user stop eventlinez 2>/dev/null || echo "Service not running or not user service"
          docker-compose down 2>/dev/null || echo "Docker compose not running"
          
          # Backup current version
          echo "💾 Creating backup..."
          timestamp=$(date +%Y%m%d_%H%M%S)
          mkdir -p ../backups
          cp -r . ../backups/eventlinez_backup_$timestamp || echo "Backup failed, continuing..."
          
          # Pull latest changes
          echo "📥 Pulling latest changes..."
          git fetch origin
          git reset --hard origin/develop
          git clean -fd
          
          # Create directories for static files and media (Docker bind mounts)
          echo "📁 Creating directories for static files..."
          mkdir -p staticfiles media
          chmod 755 staticfiles media
          
          # Install system dependencies for Python packages
          echo "📦 Checking system dependencies..."
          # Try to install PostgreSQL development headers and other build tools
          # If sudo fails, try alternative approaches or skip (packages might already be installed)
          if command -v apt-get >/dev/null 2>&1; then
            echo "🔧 Attempting to install PostgreSQL development packages..."
            sudo apt-get update 2>/dev/null || echo "⚠️ Could not update package list (might not have sudo access)"
            sudo apt-get install -y postgresql-server-dev-all python3-dev build-essential libpq-dev 2>/dev/null || echo "⚠️ Could not install system packages (might already be installed or no sudo access)"
          elif command -v yum >/dev/null 2>&1; then
            echo "🔧 Attempting to install PostgreSQL development packages (CentOS/RHEL)..."
            sudo yum update -y 2>/dev/null || echo "⚠️ Could not update package list (might not have sudo access)"
            sudo yum install -y postgresql-devel python3-devel gcc gcc-c++ 2>/dev/null || echo "⚠️ Could not install system packages (might already be installed or no sudo access)"
          else
            echo "⚠️ Package manager not recognized, skipping system package installation"
          fi
          
          # Check if pg_config is available (required for psycopg2 compilation)
          if command -v pg_config >/dev/null 2>&1; then
            echo "✅ PostgreSQL development tools are available"
          else
            echo "⚠️ PostgreSQL development tools not found - using pre-compiled binaries"
          fi
          
          # Update dependencies
          echo "📦 Updating Python dependencies..."
          
          # Detect Python version and choose appropriate requirements file
          PYTHON_VERSION=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          echo "🐍 Detected Python version: $PYTHON_VERSION"
          
          if [ "$PYTHON_VERSION" = "3.6" ]; then
            REQUIREMENTS_FILE="requirements_py36.txt"
            echo "📋 Using Python 3.6 compatible requirements"
          else
            REQUIREMENTS_FILE="requirements.txt"
            echo "📋 Using standard requirements"
          fi
          
          # Check if we're in a virtual environment
          if [ -n "$VIRTUAL_ENV" ]; then
            pip install --upgrade pip
            pip install -r $REQUIREMENTS_FILE
          else
            # If not in virtual environment, try to activate one or install globally
            if [ -d "venv" ]; then
              source venv/bin/activate
              pip install --upgrade pip
              pip install -r $REQUIREMENTS_FILE
            else
              # Create virtual environment if it doesn't exist
              python3 -m venv venv
              source venv/bin/activate
              pip install --upgrade pip
              pip install -r $REQUIREMENTS_FILE
            fi
          fi
          
          # Restart services using Docker Compose
          echo "🔄 Managing Docker Compose services..."
          if [ -f docker-compose.yml ]; then
            echo "🐳 Using Docker Compose for deployment..."
            
            # Check if Docker is installed and running
            echo "🔍 Checking Docker availability..."
            if ! command -v docker >/dev/null 2>&1; then
              echo "❌ Docker is not installed or not in PATH"
              echo "📦 Using traditional deployment..."
              systemctl --user start eventlinez 2>/dev/null || echo "Could not start user service"
              echo "✅ Deployment completed with traditional method"
              exit 0
            fi
            
            # Check if Docker daemon is running
            if ! docker info >/dev/null 2>&1; then
              echo "⚠️ Docker daemon is not running, attempting to start..."
              sudo systemctl start docker 2>/dev/null || echo "Could not start Docker daemon with systemctl"
              sudo service docker start 2>/dev/null || echo "Could not start Docker daemon with service"
              
              # Wait a moment for Docker to start
              sleep 5
              
              # Check again
              if ! docker info >/dev/null 2>&1; then
                echo "❌ Docker daemon failed to start, falling back to traditional deployment"
                systemctl --user start eventlinez 2>/dev/null || echo "Could not start user service"
                echo "✅ Deployment completed with traditional method"
                exit 0
              fi
            fi
            
            echo "✅ Docker is available and running"
            
            # Check if user can run docker commands (docker group membership)
            if ! docker version >/dev/null 2>&1; then
              echo "⚠️ Current user cannot run Docker commands, trying with sudo..."
              # If user can't run docker directly, we'll need to use sudo for all docker commands
              DOCKER_CMD="sudo docker"
              DOCKER_COMPOSE_CMD="sudo docker-compose"
            else
              DOCKER_CMD="docker"
              DOCKER_COMPOSE_CMD="docker-compose"
            fi
            
            # Stop existing containers gracefully
            echo "⏹️ Stopping existing containers..."
            $DOCKER_COMPOSE_CMD down --timeout 30 || echo "No containers to stop"
            
            # Clean up any orphaned containers and networks
            echo "🧹 Cleaning up Docker resources..."
            $DOCKER_CMD system prune -f --volumes || echo "Docker cleanup completed"
            
            # Build and start new containers
            echo "🏗️ Building and starting containers..."
            $DOCKER_COMPOSE_CMD up -d --build --force-recreate
            
            # Wait for services to be ready
            echo "⏳ Waiting for services to start..."
            sleep 15
            
            # Check if containers are running
            echo "🔍 Checking container status..."
            $DOCKER_COMPOSE_CMD ps
            
            # Wait for database to be ready (if using PostgreSQL)
            echo "🗄️ Waiting for database to be ready..."
            max_attempts=30
            attempt=1
            while [ $attempt -le $max_attempts ]; do
              if $DOCKER_COMPOSE_CMD exec -T web python -c "import django; import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'eventlinez.settings'); django.setup(); from django.db import connection; connection.ensure_connection(); print('Database is ready!')" 2>/dev/null; then
                echo "✅ Database connection successful"
                break
              else
                echo "⏳ Database not ready yet (attempt $attempt/$max_attempts)..."
                sleep 2
                attempt=$((attempt + 1))
              fi
            done
            
            if [ $attempt -gt $max_attempts ]; then
              echo "⚠️ Database readiness check timed out, but continuing..."
            fi
            
            # Wait for container initialization to complete (includes auto-seeding)
            echo "⏳ Waiting for container initialization to complete..."
            sleep 20
            
            # Check if container is running and accessible
            echo "🔍 Verifying container is ready..."
            max_attempts=15
            attempt=1
            while [ $attempt -le $max_attempts ]; do
              if $DOCKER_COMPOSE_CMD exec -T web python --version >/dev/null 2>&1; then
                echo "✅ Container is ready and accessible"
                break
              else
                echo "⏳ Container not ready yet (attempt $attempt/$max_attempts)..."
                sleep 3
                attempt=$((attempt + 1))
              fi
            done
            
            # Optional: Force re-seed if needed (manual trigger)
            if [ "$FORCE_RESEED" = "true" ]; then
              echo "🔄 Force re-seeding database..."
              $DOCKER_COMPOSE_CMD exec -T web python manage.py flush --noinput || echo "⚠️ Flush failed"
              $DOCKER_COMPOSE_CMD exec -T web python manage.py seed_data --force || echo "⚠️ Re-seeding failed"
            fi
            
            # Check Django application status
            echo "🔍 Checking Django application status..."
            $DOCKER_COMPOSE_CMD logs --tail=20 web
            
            echo "✅ Docker services started and ready"
          else
            echo "📦 Using traditional deployment..."
            
            # Reset database and run seeders for test environment (traditional deployment)
            echo "🗑️ Resetting database for fresh test data..."
            python manage.py flush --noinput || echo "⚠️ Database flush failed, continuing..."
            
            echo "🗄️ Running migrations..."
            python manage.py migrate --noinput
            
            echo "📊 Creating database views..."
            python manage.py create_sales_view --force || echo "⚠️ View creation failed, continuing..."
            
            echo "🌱 Seeding database with test data..."
            python manage.py seed_data --force
            
            echo "📁 Collecting static files..."
            python manage.py collectstatic --noinput
            
            systemctl --user start eventlinez 2>/dev/null || echo "Could not start user service"
            # Try to reload nginx if available
            systemctl reload nginx 2>/dev/null || echo "Nginx not available or no permission"
          fi
          
          # Health check
          echo "🏥 Performing health check..."
          sleep 10
          curl -f http://localhost:8000/admin/ || echo "⚠️ Health check failed"
          
          echo "✅ Deployment completed successfully!"
        EOF
    
    - name: Notify Deployment Status
      if: always() && steps.check_ssh.outputs.deployment_enabled == 'true'
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment to test.eventlinez.com completed successfully!"
        else
          echo "❌ Deployment failed!"
        fi

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Python Security Check
      run: |
        pip install safety bandit
        echo "🔍 Running dependency security scan..."
        safety check -r requirements.txt || echo "Safety scan completed with warnings"
        echo "🔍 Running code security scan..."
        bandit -r . -f json -o bandit-report.json || echo "Bandit scan completed with warnings"
        echo "✅ Security scans completed"
