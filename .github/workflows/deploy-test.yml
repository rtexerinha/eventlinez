name: Deploy to Test Server

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

env:
  PYTHON_VERSION: 3.9
  NODE_VERSION: 16

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_eventlinez
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Fetch full history for proper version tracking
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_dev.txt
    
    - name: Clean caches and run tests
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_eventlinez
        SECRET_KEY: test-secret-key-for-github-actions
        DEBUG: False
      run: |
        # Clean caches before testing
        echo "🧹 Cleaning caches..."
        python manage.py shell -c "from django.core.cache import cache; cache.clear(); print('Django cache cleared')" || echo "Could not clear Django cache"
        find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || echo "Could not clear Python cache"
        find . -name "*.pyc" -delete 2>/dev/null || echo "Could not delete .pyc files"
        pip cache purge 2>/dev/null || echo "Could not clear pip cache"
        echo "✅ Caches cleaned"
        
        # Run tests
        python manage.py collectstatic --noinput
        python manage.py migrate --noinput
        # Create views safely after migrations (PostgreSQL only)
        python manage.py create_sales_view --force || true
        python manage.py test
    
    - name: Run linting
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Fetch full history for proper version tracking
    
    - name: Get deployment info
      id: deploy_info
      run: |
        echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        echo "commit_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "commit_message=$(git log -1 --pretty=%B | head -n1)" >> $GITHUB_OUTPUT
        echo "branch_name=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        echo "timestamp=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
    
    - name: Check SSH Configuration
      id: check_ssh
      run: |
        if [ -z "${{ secrets.TEST_SERVER_HOST }}" ] || [ -z "${{ secrets.TEST_SERVER_USER }}" ] || [ -z "${{ secrets.DEPLOY_PATH }}" ]; then
          echo "🔑 Server connection secrets not configured. Skipping deployment."
          echo "📋 To enable automatic deployment, add these secrets to your GitHub repository:"
          echo "   - TEST_SERVER_HOST" 
          echo "   - TEST_SERVER_USER"
          echo "   - DEPLOY_PATH"
          echo "   - TEST_SERVER_PASSWORD (for password auth)"
          echo "deployment_enabled=false" >> $GITHUB_OUTPUT
        else
          echo "✅ Server connection secrets configured. Proceeding with deployment."
          echo "deployment_enabled=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Setup SSH Connection
      if: steps.check_ssh.outputs.deployment_enabled == 'true'
      run: |
        # Install sshpass for password authentication
        sudo apt-get update && sudo apt-get install -y sshpass
        
        # Setup known_hosts
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.TEST_SERVER_HOST }} >> ~/.ssh/known_hosts
        
        echo "✅ SSH connection setup completed"
    
    - name: Deploy to Test Server
      if: steps.check_ssh.outputs.deployment_enabled == 'true'
      env:
        TEST_SERVER_HOST: ${{ secrets.TEST_SERVER_HOST }}
        TEST_SERVER_USER: ${{ secrets.TEST_SERVER_USER }}
        TEST_SERVER_PASSWORD: ${{ secrets.TEST_SERVER_PASSWORD }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        COMMIT_SHA: ${{ steps.deploy_info.outputs.commit_sha }}
        COMMIT_SHORT: ${{ steps.deploy_info.outputs.commit_short }}
        COMMIT_MESSAGE: ${{ steps.deploy_info.outputs.commit_message }}
        BRANCH_NAME: ${{ steps.deploy_info.outputs.branch_name }}
        DEPLOY_TIMESTAMP: ${{ steps.deploy_info.outputs.timestamp }}
      run: |
        sshpass -p "$TEST_SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $TEST_SERVER_USER@$TEST_SERVER_HOST << 'EOF'
          set -e
          
          echo "🚀 Starting deployment to test server..."
          echo "📋 Deployment Info:"
          echo "   - Commit: ${{ steps.deploy_info.outputs.commit_short }}"
          echo "   - Branch: ${{ steps.deploy_info.outputs.branch_name }}"
          echo "   - Message: ${{ steps.deploy_info.outputs.commit_message }}"
          echo "   - Time: ${{ steps.deploy_info.outputs.timestamp }}"
          
          # Navigate to application directory
          cd ${{ secrets.DEPLOY_PATH }}/eventlinez
          
          # Record current version before deployment
          echo "📝 Recording deployment info..."
          current_commit=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
          echo "Current server commit: $current_commit"
          echo "Deploying commit: ${{ steps.deploy_info.outputs.commit_sha }}"
          
          # Stop application services first
          echo "⏹️ Stopping services..."
          systemctl --user stop eventlinez 2>/dev/null || echo "Service not running or not user service"
          docker-compose down --timeout 30 2>/dev/null || echo "Docker compose not running"
          
          # Create deployment log
          echo "📄 Creating deployment log..."
          mkdir -p ../deployment_logs
          cat > ../deployment_logs/deployment_$(date +%Y%m%d_%H%M%S).log << EOL
Deployment Started: ${{ steps.deploy_info.outputs.timestamp }}
Branch: ${{ steps.deploy_info.outputs.branch_name }}
Commit SHA: ${{ steps.deploy_info.outputs.commit_sha }}
Commit Short: ${{ steps.deploy_info.outputs.commit_short }}
Commit Message: ${{ steps.deploy_info.outputs.commit_message }}
Previous Commit: $current_commit
EOL
          
          # Backup current version with version info
          echo "💾 Creating versioned backup..."
          timestamp=$(date +%Y%m%d_%H%M%S)
          backup_dir="../backups/eventlinez_backup_${timestamp}_${current_commit:0:7}"
          mkdir -p ../backups
          cp -r . "$backup_dir" || echo "Backup failed, continuing..."
          
          # Force clean git state and pull latest changes
          echo "🔄 Cleaning git state and pulling latest changes..."
          git fetch --all --prune
          git reset --hard HEAD
          git clean -fd
          git checkout develop
          git reset --hard origin/develop
          git clean -fd
          
          # Verify we have the correct commit
          deployed_commit=$(git rev-parse HEAD)
          echo "✅ Deployed commit: $deployed_commit"
          if [ "$deployed_commit" != "${{ steps.deploy_info.outputs.commit_sha }}" ]; then
            echo "⚠️ WARNING: Deployed commit ($deployed_commit) doesn't match expected commit (${{ steps.deploy_info.outputs.commit_sha }})"
            echo "This might indicate a git synchronization issue."
          else
            echo "✅ Commit verification successful"
          fi
          
          # Record successful pull in deployment log
          echo "Git Pull Completed: $(date)" >> ../deployment_logs/deployment_$(date +%Y%m%d_%H%M%S).log
          echo "Actual Deployed Commit: $deployed_commit" >> ../deployment_logs/deployment_$(date +%Y%m%d_%H%M%S).log
          
          # Comprehensive cache cleaning
          echo "🧹 Comprehensive cache cleaning..."
          
          # Python caches
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || echo "Could not clear Python cache"
          find . -name "*.pyc" -delete 2>/dev/null || echo "Could not delete .pyc files"
          find . -name "*.pyo" -delete 2>/dev/null || echo "Could not delete .pyo files"
          
          # Django caches
          python manage.py shell -c "from django.core.cache import cache; cache.clear(); print('Django cache cleared')" 2>/dev/null || echo "Could not clear Django cache"
          
          # Template caches
          find . -name "*.pyc" -path "*/templates/*" -delete 2>/dev/null || echo "Could not clear template cache"
          
          # Static files cache
          rm -rf staticfiles/* 2>/dev/null || echo "Could not clear static files"
          
          # Temporary files
          rm -rf /tmp/eventlinez_* 2>/dev/null || echo "Could not clear temp files"
          rm -rf /tmp/django_* 2>/dev/null || echo "Could not clear Django temp files"
          
          # Pip caches
          pip cache purge 2>/dev/null || echo "Could not clear pip cache"
          
          echo "✅ Comprehensive cache cleaning completed"
          
          # Detect deployment method and proceed accordingly
          if [ -f docker-compose.yml ]; then
            echo "🐳 Using Docker Compose deployment..."
            
            # Verify Docker is available
            if ! command -v docker >/dev/null 2>&1; then
              echo "❌ Docker not available, falling back to traditional deployment"
              USE_DOCKER=false
            elif ! docker info >/dev/null 2>&1; then
              echo "❌ Docker daemon not running, falling back to traditional deployment"
              USE_DOCKER=false
            else
              USE_DOCKER=true
            fi
            
            if [ "$USE_DOCKER" = "true" ]; then
              # Docker deployment
              DOCKER_CMD="docker"
              DOCKER_COMPOSE_CMD="docker-compose"
              
              # Test Docker permissions
              if ! docker version >/dev/null 2>&1; then
                DOCKER_CMD="sudo docker"
                DOCKER_COMPOSE_CMD="sudo docker-compose"
              fi
              
              # Force rebuild containers with no cache
              echo "🏗️ Force rebuilding containers..."
              $DOCKER_COMPOSE_CMD down --volumes --remove-orphans
              $DOCKER_CMD system prune -af --volumes
              $DOCKER_COMPOSE_CMD build --no-cache --pull
              
              # Start containers
              echo "🚀 Starting fresh containers..."
              $DOCKER_COMPOSE_CMD up -d --force-recreate
              
              # Wait for services
              echo "⏳ Waiting for services to be ready..."
              sleep 30
              
              # Verify containers are running
              echo "🔍 Verifying container status..."
              $DOCKER_COMPOSE_CMD ps
              
              # Health check
              max_attempts=20
              attempt=1
              while [ $attempt -le $max_attempts ]; do
                if $DOCKER_COMPOSE_CMD exec -T web python --version >/dev/null 2>&1; then
                  echo "✅ Container health check passed"
                  break
                else
                  echo "⏳ Container not ready yet (attempt $attempt/$max_attempts)..."
                  sleep 5
                  attempt=$((attempt + 1))
                fi
              done
              
              # Clean caches inside container
              echo "🧹 Cleaning caches inside container..."
              $DOCKER_COMPOSE_CMD exec -T web python manage.py shell -c "from django.core.cache import cache; cache.clear(); print('Django cache cleared')" || echo "Could not clear Django cache in container"
              
              DEPLOYMENT_METHOD="Docker"
            else
              USE_DOCKER=false
            fi
          else
            USE_DOCKER=false
          fi
          
          if [ "$USE_DOCKER" = "false" ]; then
            echo "📦 Using traditional deployment..."
            
            # Update dependencies
            echo "📦 Updating dependencies..."
            PYTHON_VERSION=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
            
            if [ "$PYTHON_VERSION" = "3.6" ]; then
              REQUIREMENTS_FILE="requirements_py36.txt"
            else
              REQUIREMENTS_FILE="requirements.txt"
            fi
            
            # Virtual environment handling
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r $REQUIREMENTS_FILE
            
            # Database operations
            echo "🗄️ Running database operations..."
            python manage.py migrate --noinput
            python manage.py create_sales_view --force || echo "View creation failed"
            
            # Static files
            echo "📁 Collecting static files..."
            python manage.py collectstatic --noinput --clear
            
            # Start service
            echo "🚀 Starting application service..."
            systemctl --user start eventlinez 2>/dev/null || echo "Could not start user service"
            
            DEPLOYMENT_METHOD="Traditional"
          fi
          
          # Final verification
          echo "🔍 Final deployment verification..."
          
          # Create version info file for verification
          cat > version_info.json << EOL
{
  "deployment_time": "${{ steps.deploy_info.outputs.timestamp }}",
  "commit_sha": "${{ steps.deploy_info.outputs.commit_sha }}",
  "commit_short": "${{ steps.deploy_info.outputs.commit_short }}",
  "branch": "${{ steps.deploy_info.outputs.branch_name }}",
  "commit_message": "${{ steps.deploy_info.outputs.commit_message }}",
  "deployment_method": "$DEPLOYMENT_METHOD"
}
EOL
          
          # Make version info accessible via web
          cp version_info.json staticfiles/ 2>/dev/null || echo "Could not copy version info to static files"
          
          # Test application
          echo "🏥 Testing application..."
          sleep 15
          
          # Test local access
          if curl -f http://localhost:8000/ >/dev/null 2>&1; then
            echo "✅ Local application test passed"
          else
            echo "⚠️ Local application test failed"
          fi
          
          # Test static files
          echo "🧪 Testing static files..."
          if [ -f "staticfiles/css/bootstrap.min.css" ]; then
            echo "✅ Static files are present"
          else
            echo "❌ Static files missing - running collection again..."
            python manage.py collectstatic --noinput --clear
          fi
          
          # Final git verification
          final_commit=$(git rev-parse HEAD)
          echo "🔍 Final commit verification: $final_commit"
          
          # Update deployment log
          cat >> ../deployment_logs/deployment_$(date +%Y%m%d_%H%M%S).log << EOL
Deployment Method: $DEPLOYMENT_METHOD
Final Commit: $final_commit
Deployment Completed: $(date)
Status: SUCCESS
EOL
          
          echo "✅ Deployment completed successfully!"
          echo "📋 Deployment Summary:"
          echo "   - Method: $DEPLOYMENT_METHOD"
          echo "   - Commit: $final_commit"
          echo "   - Time: $(date)"
        EOF
    
    - name: Verify Deployment
      if: steps.check_ssh.outputs.deployment_enabled == 'true'
      env:
        TEST_SERVER_HOST: ${{ secrets.TEST_SERVER_HOST }}
        TEST_SERVER_USER: ${{ secrets.TEST_SERVER_USER }}
        TEST_SERVER_PASSWORD: ${{ secrets.TEST_SERVER_PASSWORD }}
      run: |
        echo "🔍 Verifying deployment..."
        
        # Wait a moment for services to stabilize
        sleep 30
        
        # Test public access
        if curl -f https://test.eventlinez.com/ >/dev/null 2>&1; then
          echo "✅ Public site is accessible"
        else
          echo "⚠️ Public site test failed"
        fi
        
        # Test version endpoint if available
        if curl -f https://test.eventlinez.com/static/version_info.json >/dev/null 2>&1; then
          echo "✅ Version info is accessible"
          curl -s https://test.eventlinez.com/static/version_info.json
        else
          echo "⚠️ Version info not accessible"
        fi
    
    - name: Notify Deployment Status
      if: always() && steps.check_ssh.outputs.deployment_enabled == 'true'
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment to test.eventlinez.com completed successfully!"
          echo "🌐 Site: https://test.eventlinez.com/"
          echo "📊 Commit: ${{ steps.deploy_info.outputs.commit_short }}"
          echo "⏰ Time: ${{ steps.deploy_info.outputs.timestamp }}"
        else
          echo "❌ Deployment failed!"
          echo "📋 Check the deployment logs for details"
        fi

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Python Security Check
      run: |
        pip install safety bandit
        echo "🔍 Running dependency security scan..."
        safety check -r requirements.txt || echo "Safety scan completed with warnings"
        echo "🔍 Running code security scan..."
        bandit -r . -f json -o bandit-report.json || echo "Bandit scan completed with warnings"
        echo "✅ Security scans completed"
