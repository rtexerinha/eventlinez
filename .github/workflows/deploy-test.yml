name: Deploy to Test Server

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_eventlinez
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: |
        echo "🐳 Building Docker image using same Python 3.6 setup as local environment..."
        docker build -t eventlinez-test .

    - name: Create test environment file
      run: |
        cat > .env.test << EOF
        DEBUG=False
        SECRET_KEY=test-secret-key-for-github-actions
        DATABASE_URL=postgres://postgres:postgres@host.docker.internal:5432/test_eventlinez
        ALLOWED_HOSTS=localhost,127.0.0.1
        STATIC_ROOT=/app/staticfiles
        MEDIA_ROOT=/app/media
        ENVIRONMENT=test
        EOF

    - name: Run tests in Docker container
      run: |
        echo "🧪 Running tests in Docker container (Python 3.6)..."
        docker run --rm \
          --network host \
          -v $(pwd):/app \
          -w /app \
          --env-file .env.test \
          eventlinez-test bash -c "
            echo '🧹 Cleaning caches...'
            find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
            find . -name '*.pyc' -delete 2>/dev/null || true
            pip cache purge 2>/dev/null || true
            echo '✅ Caches cleaned'
            
            echo '📦 Collecting static files...'
            python manage.py collectstatic --noinput
            
            echo '🗄️ Running migrations...'
            python manage.py migrate --noinput
            
            echo '📊 Creating database views...'
            python manage.py create_sales_view --force || true
            
            echo '🧪 Running tests...'
            python manage.py test
            
            echo '✅ All tests completed successfully!'
          "

    - name: Run linting in Docker container
      run: |
        echo "🔍 Running linting in Docker container..."
        docker run --rm \
          -v $(pwd):/app \
          -w /app \
          eventlinez-test bash -c "
            pip install flake8
            echo '🔍 Running flake8 linting...'
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
            flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
            echo '✅ Linting completed'
          "

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Get deployment info
      id: deploy_info
      run: |
        echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        echo "commit_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "commit_message=$(git log -1 --pretty=%B | head -n1 | tr -d '\n' | tr -d '\r')" >> $GITHUB_OUTPUT
        echo "branch_name=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        echo "timestamp=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

    - name: Check SSH Configuration
      id: check_ssh
      run: |
        if [ -z "${{ secrets.TEST_SERVER_HOST }}" ] || [ -z "${{ secrets.TEST_SERVER_USER }}" ] || [ -z "${{ secrets.DEPLOY_PATH }}" ]; then
          echo "🔑 Server connection secrets not configured. Skipping deployment."
          echo "deployment_enabled=false" >> $GITHUB_OUTPUT
        else
          echo "✅ Server connection secrets configured. Proceeding with deployment."
          echo "deployment_enabled=true" >> $GITHUB_OUTPUT
        fi

    - name: Setup SSH Connection
      if: steps.check_ssh.outputs.deployment_enabled == 'true'
      run: |
        sudo apt-get update && sudo apt-get install -y sshpass
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.TEST_SERVER_HOST }} >> ~/.ssh/known_hosts
        echo "✅ SSH connection setup completed"

    - name: Create deployment script
      if: steps.check_ssh.outputs.deployment_enabled == 'true'
      run: |
        cat > deploy_script.sh << 'SCRIPT_EOF'
        #!/bin/bash
        set -e
        
        echo "🚀 Starting deployment to test server..."
        echo "📋 Deployment Info:"
        echo "   - Commit: $COMMIT_SHORT"
        echo "   - Branch: $BRANCH_NAME"
        echo "   - Message: $COMMIT_MESSAGE"
        echo "   - Time: $DEPLOY_TIMESTAMP"
        
        # Navigate to application directory
        cd $DEPLOY_PATH
        
        # Record current version
        current_commit=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
        echo "Current server commit: $current_commit"
        echo "Deploying commit: $COMMIT_SHA"
        
        # Stop services
        echo "⏹️ Stopping services..."
        systemctl --user stop eventlinez 2>/dev/null || echo "Service not running"
        docker-compose down --timeout 30 2>/dev/null || echo "Docker compose not running"
        
        # Create deployment log
        mkdir -p ../deployment_logs
        echo "Deployment Started: $DEPLOY_TIMESTAMP" > ../deployment_logs/deployment_$(date +%Y%m%d_%H%M%S).log
        echo "Branch: $BRANCH_NAME" >> ../deployment_logs/deployment_$(date +%Y%m%d_%H%M%S).log
        echo "Commit SHA: $COMMIT_SHA" >> ../deployment_logs/deployment_$(date +%Y%m%d_%H%M%S).log
        echo "Previous Commit: $current_commit" >> ../deployment_logs/deployment_$(date +%Y%m%d_%H%M%S).log
        
        # Backup current version
        echo "💾 Creating backup..."
        timestamp=$(date +%Y%m%d_%H%M%S)
        backup_dir="../backups/eventlinez_backup_${timestamp}_${current_commit:0:7}"
        mkdir -p ../backups
        cp -r . "$backup_dir" || echo "Backup failed, continuing..."
        
        # Force clean git state
        echo "🔄 Cleaning git state and pulling latest changes..."
        git fetch --all --prune
        git reset --hard HEAD
        git clean -fd
        git checkout develop
        git reset --hard origin/develop
        git clean -fd
        
        # Verify commit
        deployed_commit=$(git rev-parse HEAD)
        echo "✅ Deployed commit: $deployed_commit"
        if [ "$deployed_commit" != "$COMMIT_SHA" ]; then
          echo "⚠️ WARNING: Commit mismatch!"
        else
          echo "✅ Commit verification successful"
        fi
        
        # Clean caches
        echo "🧹 Cleaning caches..."
        find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
        find . -name "*.pyc" -delete 2>/dev/null || true
        find . -name "*.pyo" -delete 2>/dev/null || true
        python manage.py shell -c "from django.core.cache import cache; cache.clear(); print('Cache cleared')" 2>/dev/null || true
        rm -rf staticfiles/* 2>/dev/null || true
        rm -rf /tmp/eventlinez_* 2>/dev/null || true
        pip cache purge 2>/dev/null || true
        echo "✅ Caches cleaned"
        
        # Choose deployment method
        if [ -f docker-compose.yml ] && command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
          echo "🐳 Using Docker deployment..."
          DOCKER_COMPOSE_CMD="docker-compose"
          if ! docker version >/dev/null 2>&1; then
            DOCKER_COMPOSE_CMD="sudo docker-compose"
          fi
          
          $DOCKER_COMPOSE_CMD down --volumes --remove-orphans
          docker system prune -af --volumes 2>/dev/null || sudo docker system prune -af --volumes
          $DOCKER_COMPOSE_CMD build --no-cache --pull
          $DOCKER_COMPOSE_CMD up -d --force-recreate
          
          echo "⏳ Waiting for containers..."
          sleep 30
          
          $DOCKER_COMPOSE_CMD ps
          DEPLOYMENT_METHOD="Docker"
        else
          echo "📦 Using traditional deployment..."
          
          # Detect OS for proper Python path
          if [ -f /etc/redhat-release ]; then
            echo "🖥️ Detected CentOS/RHEL system"
            # Check for pyenv installation first (sunset user's pyenv)
            if [ -f /app/.pyenv/versions/3.9.24/bin/python ]; then
              PYTHON_CMD="/app/.pyenv/versions/3.9.24/bin/python"  
              PIP_CMD="/app/.pyenv/versions/3.9.24/bin/pip"
              echo "✅ Using pyenv Python 3.9.24"
            elif [ -f /usr/local/bin/python3.9 ]; then
              PYTHON_CMD="/usr/local/bin/python3.9"
              PIP_CMD="/usr/local/bin/pip3.9"
              echo "✅ Using system Python 3.9"
            else
              PYTHON_CMD="python3"
              PIP_CMD="pip3"
              echo "⚠️ Falling back to system Python 3"
            fi
            # Ensure proper PATH for CentOS with pyenv
            export PATH="/usr/local/bin:/app/.pyenv/versions/3.9.24/bin:$PATH"
            export PYENV_ROOT="/app/.pyenv"
          else
            echo "🖥️ Detected Debian/Ubuntu system"
            PYTHON_CMD="python3.9"
            PIP_CMD="pip3.9"
          fi
          
          # Ensure Python 3.9 is available
          echo "🐍 Verifying Python 3.9..."
          if $PYTHON_CMD --version 2>/dev/null | grep -q "3.9"; then
            echo "✅ Python 3.9 found at $PYTHON_CMD"
            $PYTHON_CMD --version
          else
            echo "⚠️ Python 3.9 not found, using available Python 3"
            PYTHON_CMD="python3"
            PIP_CMD="pip3"
          fi
          
          # Virtual environment
          if [ ! -d "venv" ]; then
            $PYTHON_CMD -m venv venv
          fi
          source venv/bin/activate
          
          # Verify Python version in virtual environment
          echo "🐍 Using Python version: $(python --version)"
          
          pip install --upgrade pip
          pip install -r requirements.txt
          
          # Database and static files
          python manage.py migrate --noinput
          python manage.py create_sales_view --force || echo "View creation failed"
          python manage.py collectstatic --noinput --clear
          
          # Start service (CentOS 7 uses systemctl)
          if command -v systemctl >/dev/null 2>&1; then
            sudo systemctl start eventlinez 2>/dev/null || echo "Could not start systemd service"
          else
            # Fallback for systems without systemd
            systemctl --user start eventlinez 2>/dev/null || echo "Could not start user service"
          fi
          
          DEPLOYMENT_METHOD="Traditional"
        fi
        
        # Create version info
        echo "{" > version_info.json
        echo "  \"deployment_time\": \"$DEPLOY_TIMESTAMP\"," >> version_info.json
        echo "  \"commit_sha\": \"$COMMIT_SHA\"," >> version_info.json
        echo "  \"commit_short\": \"$COMMIT_SHORT\"," >> version_info.json
        echo "  \"branch\": \"$BRANCH_NAME\"," >> version_info.json
        echo "  \"commit_message\": \"$COMMIT_MESSAGE\"," >> version_info.json
        echo "  \"deployment_method\": \"$DEPLOYMENT_METHOD\"" >> version_info.json
        echo "}" >> version_info.json
        
        cp version_info.json staticfiles/ 2>/dev/null || echo "Could not copy version info"
        
        # Final tests
        echo "🏥 Testing application..."
        sleep 15
        
        if curl -f http://localhost:8000/ >/dev/null 2>&1; then
          echo "✅ Local application test passed"
        else
          echo "⚠️ Local application test failed"
        fi
        
        if [ -f "staticfiles/css/bootstrap.min.css" ]; then
          echo "✅ Static files present"
        else
          echo "❌ Static files missing"
          python manage.py collectstatic --noinput --clear
        fi
        
        # Update deployment log
        final_commit=$(git rev-parse HEAD)
        echo "Deployment Method: $DEPLOYMENT_METHOD" >> ../deployment_logs/deployment_$(date +%Y%m%d_%H%M%S).log
        echo "Final Commit: $final_commit" >> ../deployment_logs/deployment_$(date +%Y%m%d_%H%M%S).log
        echo "Status: SUCCESS" >> ../deployment_logs/deployment_$(date +%Y%m%d_%H%M%S).log
        
        echo "✅ Deployment completed successfully!"
        SCRIPT_EOF
        
        chmod +x deploy_script.sh

    - name: Deploy to Test Server
      if: steps.check_ssh.outputs.deployment_enabled == 'true'
      env:
        COMMIT_SHA: ${{ steps.deploy_info.outputs.commit_sha }}
        COMMIT_SHORT: ${{ steps.deploy_info.outputs.commit_short }}
        COMMIT_MESSAGE: ${{ steps.deploy_info.outputs.commit_message }}
        BRANCH_NAME: ${{ steps.deploy_info.outputs.branch_name }}
        DEPLOY_TIMESTAMP: ${{ steps.deploy_info.outputs.timestamp }}
        DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      run: |
        sshpass -p "${{ secrets.TEST_SERVER_PASSWORD }}" scp -o StrictHostKeyChecking=no deploy_script.sh ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }}:/tmp/deploy_script.sh
        sshpass -p "${{ secrets.TEST_SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} "
          export COMMIT_SHA='$COMMIT_SHA'
          export COMMIT_SHORT='$COMMIT_SHORT'
          export COMMIT_MESSAGE='$COMMIT_MESSAGE'
          export BRANCH_NAME='$BRANCH_NAME'
          export DEPLOY_TIMESTAMP='$DEPLOY_TIMESTAMP'
          export DEPLOY_PATH='$DEPLOY_PATH'
          chmod +x /tmp/deploy_script.sh
          /tmp/deploy_script.sh
          rm -f /tmp/deploy_script.sh
        "

    - name: Verify Deployment
      if: steps.check_ssh.outputs.deployment_enabled == 'true'
      run: |
        echo "🔍 Verifying deployment..."
        sleep 30
        
        # Verify git changes were applied on the test server
        echo "🔄 Verifying git repository state on test server..."
        sshpass -p "${{ secrets.TEST_SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} "
          cd ${{ secrets.DEPLOY_PATH }}/eventlinez
          echo '📥 Fetching latest changes...'
          git fetch origin develop
          echo '⬇️ Pulling from develop branch...'
          git pull origin develop
          echo '✅ Git repository updated'
          
          current_commit=\$(git rev-parse HEAD)
          echo \"Current commit on server: \$current_commit\"
          echo \"Expected commit: ${{ steps.deploy_info.outputs.commit_sha }}\"
          
          if [ \"\$current_commit\" = \"${{ steps.deploy_info.outputs.commit_sha }}\" ]; then
            echo \"✅ Git commit verification successful\"
          else
            echo \"⚠️ WARNING: Git commit mismatch detected!\"
            echo \"Expected: ${{ steps.deploy_info.outputs.commit_sha }}\"
            echo \"Actual: \$current_commit\"
          fi
          
          echo \"📋 Latest commit info:\"
          git log -1 --oneline
          echo \"📂 Current branch: \$(git branch --show-current)\"
          echo \"🔗 Remote tracking: \$(git rev-parse --abbrev-ref HEAD@{upstream} 2>/dev/null || echo 'Not set')\"
        "
        
        if curl -f https://test.eventlinez.com/ >/dev/null 2>&1; then
          echo "✅ Public site is accessible"
        else
          echo "⚠️ Public site test failed"
        fi
        
        if curl -f https://test.eventlinez.com/static/version_info.json >/dev/null 2>&1; then
          echo "✅ Version info is accessible"
          curl -s https://test.eventlinez.com/static/version_info.json
        else
          echo "⚠️ Version info not accessible"
        fi

    - name: Notify Deployment Status
      if: always() && steps.check_ssh.outputs.deployment_enabled == 'true'
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment to test.eventlinez.com completed successfully!"
          echo "🌐 Site: https://test.eventlinez.com/"
          echo "📊 Commit: ${{ steps.deploy_info.outputs.commit_short }}"
          echo "⏰ Time: ${{ steps.deploy_info.outputs.timestamp }}"
        else
          echo "❌ Deployment failed!"
        fi

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image for security scan
      run: |
        echo "🐳 Building Docker image for security scanning..."
        docker build -t eventlinez-security .
    
    - name: Python Security Check in Docker
      run: |
        echo "🔍 Running security scans in Docker container (Python 3.6)..."
        docker run --rm \
          -v $(pwd):/app \
          -w /app \
          eventlinez-security bash -c "
            pip install safety bandit
            echo '🔍 Running security scans...'
            safety check -r requirements.txt || echo 'Safety scan completed'
            bandit -r . -f json -o bandit-report.json || echo 'Bandit scan completed'
            echo '✅ Security scans completed'
          "
