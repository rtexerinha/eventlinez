{% extends "base.html" %}
{% load static %}
{% block metadescription %}{% endblock %}
{% block title %}
	Contact - Eventlinez!
{% endblock %}


{% block content %}
    <main class="col-lg-12 col-sm-12" style="padding-right: 0;">
        <section class="col-lg-12 float-right" id="background" style="height: 254px;">
        </section>
        <div class="clearfix"></div>
    </main>

        <section class="col-sm-12 col-xl-12 col-lg-12 col-md-12 mt-5 mb-5" style="min-height: 50vh; margin: auto;">
        <div class="row">
            <div class="col-lg-5 pl-sm-4 ml-lg-5 pl-lg-4 pl-xl-4 about-mobile">
                <h1 class="title-about pb-1">Contact</h1>

                <div class="form-area ml-lg-4 ml-xl-4 ml-sm-0">
                    <form role="form" method="POST">
                        {% csrf_token %}
                        <div class="form-group">
                            {{ form.as_p }}
                        </div>
                        <button type="submit" name="submit" class="btn-form">Send</button>
                    </form>
                </div>
            </div>

            <aside class="col-lg-6 mt-5 pt-lg-5 pt-xl-5">
                <img style="width: 90%; display: block; margin: auto"
                     src="{% static 'img/contact.jpg' %}"
                     alt="Ilustração de uma pessoa no computador">
            </aside>

        </div>

    </section>

{% endblock %}
